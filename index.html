<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp English</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b3d91"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#0f2a4a;--mut:#5a6f8c;--pri:#1565d8;--pri2:#0b3d91;--line:#d6e2f5;--ok:#17803f;--bad:#c93a3a;--sf:#eaf2ff;--onp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1626;--card:#13233b;--ink:#e8f0ff;--mut:#9db3d3;--pri:#5aa0ff;--pri2:#123a7a;--line:#25405f;--ok:#4cc784;--bad:#ff8080;--sf:#183050;--onp:#06182f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1626;--card:#13233b;--ink:#e8f0ff;--mut:#9db3d3;--pri:#5aa0ff;--pri2:#123a7a;--line:#25405f;--ok:#4cc784;--bad:#ff8080;--sf:#183050;--onp:#06182f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Lexend,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri2);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pri2);color:#fff;padding:12px 16px;font-weight:600;font-size:18px;z-index:5}
header span{font-weight:400;opacity:.85;font-size:13px;margin-left:8px}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h2{margin:8px 0 12px;font-size:22px}h3{margin:18px 0 8px;font-size:17px}p{margin:6px 0}small,.note{color:var(--mut);font-size:13px}
.hero{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:18px;padding:22px}
.hero h1{margin:0 0 6px;font-size:24px;line-height:1.25}.hero p{opacity:.92}.hero .b{background:#fff;color:#0b3d91;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.tap{cursor:pointer}.c{text-align:center}.big{font-size:26px;font-weight:600;margin:4px 0}
.b{background:var(--pri);color:var(--onp);border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;min-height:44px;cursor:pointer;margin:6px 6px 6px 0}
.alt{background:var(--sf);color:var(--pri)}.w{width:100%;margin-right:0}.sm{padding:8px 12px;min-height:40px;font-size:14px}
.ic{background:var(--sf);border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;padding:8px 0;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.bub{background:var(--sf);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}
textarea,input[type=search]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.chips,.seg,.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip,.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on,.seg button.on{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.bar{height:10px;background:var(--sf);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.grid,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .b{margin:0}.grid2 .card{margin:0}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:inherit;min-height:44px;cursor:pointer}
.o.ok{border-color:var(--ok);background:var(--sf)}.o.bad{border-color:var(--bad)}.fb{font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:8px 4px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pri2);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:20;max-width:88%}
table.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}.tb td:first-child,.tb th:first-child{text-align:left}
.b.sm{min-height:44px}.chip,.seg button{min-height:42px}.ic{width:44px;height:44px}html,body{overflow-x:hidden}.row span,.card p,.card b{overflow-wrap:anywhere}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
</style></head><body>
<header style="display:flex;align-items:center;gap:8px;white-space:nowrap"><button onclick="menu()" aria-label="Menu" style="background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:2px 8px 2px 0;cursor:pointer">☰</button><span>SpeakUp English</span><span id="lvb" style="display:none"></span><span id="hu" style="margin-left:auto"></span></header>
<main id="v"></main><nav id="nav"></nav><div id="toast" role="status"></div>
<script>
/* ===== CONTENT (edit or replace later with files or a server) ===== */
const LV={A:'Beginner A1–A2',B:'Intermediate B1–B2',C:'Advanced C1–C2'};
const L=[
['Greetings','A','Say hello and goodbye politely at any time of day.',['Good morning! How are you?','Nice to meet you.','See you tomorrow.']],
['Introducing Yourself','A','Share your name, country and job in simple sentences.',['My name is Sara, and I am from Egypt.','I work as a teacher.','I am learning English.']],
['Numbers, Time and Dates','A','Ask and tell the time and talk about prices.',['What time is it?','The class starts at half past nine.','How much is this?']],
['Shopping','A','Ask about prices, sizes and ways to pay.',['Do you have this in a larger size?','Can I pay by card?','I will take it, please.']],
['Ordering Food','B','Order politely and solve small problems in a restaurant.',['I would like the chicken, please.','Could we have the bill, please?','This is not what I ordered.']],
['Travel and Directions','B','Find your way and handle problems when you travel.',['Excuse me, how do I get to the station?','Is this seat taken?','My flight has been delayed.']],
['Talking About the Past','B','Tell short stories with past tenses.',['Yesterday I visited my cousin.','I had never tried sushi before.','While I was walking, it started to rain.']],
['Job Interviews','B','Describe your experience and strengths with confidence.',['I have three years of experience in sales.','My greatest strength is solving problems calmly.','I would like to grow with your company.']],
['Giving Opinions','C','Express and defend a view with nuance.',['From my perspective, remote work boosts productivity.','I see your point, but I would argue otherwise.','That said, the evidence is mixed.']],
['Idioms and Nuance','C','Sound more natural with common idioms.',['Let’s call it a day.','It is a piece of cake.','I am feeling under the weather today.']]];
const W=`breakfast|Daily life|the first meal of the day|I eat breakfast at seven.
neighbour|Daily life|a person who lives near you|My neighbour is very kind.
schedule|Daily life|a plan of times for activities|My schedule is busy today.
borrow|Daily life|to take something and give it back later|Can I borrow your pen?
tired|Feelings|needing rest or sleep|I am tired after work.
excited|Feelings|very happy about something coming|She is excited about the trip.
nervous|Feelings|a little afraid or worried|I feel nervous before interviews.
proud|Feelings|happy about what you or others did|He is proud of his son.
ticket|Travel|a document that lets you travel|I bought a train ticket.
luggage|Travel|the bags you take on a trip|Our luggage is heavy.
passport|Travel|an official ID for foreign travel|Please show your passport.
delay|Travel|a time when something is late|There is a delay of one hour.
receipt|Shopping|a paper that shows what you paid|Keep the receipt.
discount|Shopping|a lower price|They offer a ten percent discount.
cashier|Shopping|a person who takes your payment|Please pay the cashier.
refund|Shopping|money returned to you|I asked for a refund.
menu|Food|a list of dishes in a restaurant|Can I see the menu?
delicious|Food|tasting very good|The soup is delicious.
bill|Food|the paper showing what to pay|Could we have the bill?
vegetarian|Food|a person who does not eat meat|I am vegetarian.
colleague|Work|a person you work with|My colleague helped me.
deadline|Work|the last time to finish something|The deadline is Friday.
resume|Work|a document about your jobs and skills|I sent my resume yesterday.
promotion|Work|a move to a better job|She got a promotion.
reliable|Advanced|able to be trusted|He is a reliable partner.
reluctant|Advanced|not willing to do something|I was reluctant to agree.
ambiguous|Advanced|having more than one meaning|The answer was ambiguous.
elaborate|Advanced|to explain with more detail|Could you elaborate?
thrive|Advanced|to grow and do very well|Plants thrive in sunlight.
inevitable|Advanced|certain to happen|Change is inevitable.`.split('\n').map(x=>x.split('|'));
const SC=[
['Introductions','👋',[['Hi! I don’t think we have met. What’s your name?','Hi, I’m Ali. Nice to meet you.'],['Where are you from?','I’m from Brazil.'],['What do you do?','I’m a student, and I’m learning English.']]],
['Shopping','🛍️',[['Hello! Can I help you?','Yes, please. I’m looking for a blue jacket.'],['What size do you need?','Medium, please. How much is it?'],['It’s forty dollars.','That sounds good. Can I pay by card?']]],
['At a Restaurant','🍽️',[['Good evening. Are you ready to order?','Yes, I’d like the pasta and a glass of water.'],['Would you like anything else?','No, thank you. That’s all for now.'],['Here is your food. Enjoy!','Thank you. Could we have the bill, please?']]],
['Travel at the Airport','✈️',[['Good morning. May I see your passport?','Of course. Here you are.'],['What is the purpose of your visit?','I’m here on holiday for two weeks.'],['Enjoy your stay!','Thank you very much.']]],
['Job Interview','💼',[['Tell me a little about yourself.','I’m a hard-working person with two years of experience in customer service.'],['Why do you want this job?','I enjoy working with people, and I want to learn and grow.'],['Do you have any questions for us?','Yes. What does a typical day in this role look like?']]]];
const RS=['The weather is lovely today.','Could you speak more slowly, please?','I would like a cup of tea.','Where is the nearest bus stop?','I have lived here for three years.','Thank you for your help.'];
const G=[
['Tenses','⏱️','<b>Present simple</b> is for habits: I work. <b>Present continuous</b> is for now: I am working. <b>Past simple</b> is for finished actions: I worked. <b>Present perfect</b> links past and now: I have worked here for a year.',[['She ___ to school every day.',['go','goes','is go'],1,'Habits use present simple, and he/she/it adds -s.'],['I ___ dinner right now.',['cook','am cooking','cooked'],1,'“Right now” needs present continuous.']]],
['Sentence Structure','🧱','Basic order is <b>Subject + Verb + Object</b>: I like tea. Questions use <b>Auxiliary + Subject + Verb</b>: Do you like tea? Put time and place at the end.',[['Choose the correct order.',['Like I tea','I like tea','Tea like I'],1,'English uses Subject + Verb + Object.'],['Choose the correct question.',['You do like tea?','Do you like tea?','Like you tea?'],1,'Questions begin with the auxiliary do/does.']]],
['Articles','📰','Use <b>a</b> before consonant sounds, <b>an</b> before vowel sounds, and <b>the</b> for something specific or unique. Use no article for general plurals: I like dogs.',[['She has ___ apple.',['a','an','the'],1,'“Apple” starts with a vowel sound, so use an.'],['I saw ___ moon last night.',['a','an','the'],2,'There is only one moon, so use the.']]],
['Prepositions','📍','<b>Time:</b> at 5 pm, on Monday, in July. <b>Place:</b> at the door, on the table, in the box.',[['The class is ___ Monday.',['at','on','in'],1,'Days use on.'],['We meet ___ 6 pm.',['at','on','in'],0,'Exact times use at.']]],
['Common Mistakes','⚠️','Say “I am 20 years old”, not “I have 20 years”. Use <b>many</b> with countable nouns and <b>much</b> with uncountable nouns. Say “He doesn’t”, not “He don’t”.',[['He ___ like coffee.',['don’t','doesn’t','not'],1,'He/she/it uses doesn’t.'],['I have ___ friends here.',['much','many','little'],1,'Friends are countable, so use many.']]]];
const Q=[
['Choose the correct sentence.',['She go to work.','She goes to work.','She going to work.'],1,'He/she/it adds -s in present simple.'],
['“Could I have the bill?” Where would you say this?',['At a restaurant','At a bank','At a school'],0,'You ask for the bill after a meal.'],
['Which word means almost the same as “delicious”?',['tasty','boring','late'],0,'Tasty also means good to eat.'],
['I ___ here since 2020.',['live','have lived','am living'],1,'Since + a starting point uses present perfect.'],
['Choose the article: ___ hour',['a','an','the'],1,'“Hour” starts with a vowel sound because the h is silent.'],
['The meeting is ___ 3 pm.',['on','at','in'],1,'Exact times use at.'],
['What does “reluctant” mean?',['eager','unwilling','tired'],1,'Reluctant means not willing.'],
['Best reply to “Nice to meet you.”',['Nice to meet you too.','I’m fine, thanks.','See you later.'],0,'Return the same greeting.'],
['“Under the weather” means…',['feeling slightly ill','standing outside','very happy'],0,'It is an idiom for feeling unwell.'],
['Which sentence is the most polite?',['Give me water.','I want water.','Could I have some water, please?'],2,'“Could I… please?” is polite.']];

/* ===== STATE (saved in this browser only; replace save() with a cloud call later) ===== */
const D=()=>({done:[],tr:[],pl:[],c30:[],fb:[],best:null,scores:[],days:{},streak:0,last:'',lv:'A',goal:5});
/* Store: swap for cloud sync + sign-in later. Access: later set from a server-verified subscription. */
const Store={load(){try{return JSON.parse(localStorage.getItem('su')||'{}')}catch(e){return{}}},save(s){try{localStorage.setItem('su',JSON.stringify(s))}catch(e){}}};
const Access={previewUnlocked:true,canUse:()=>Access.previewUnlocked};
let S=Object.assign(D(),Store.load());
const save=()=>{Store.save(S);cloudQ()};
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),yday=()=>new Date(Date.now()-864e5).toISOString().slice(0,10);
function act(){const t=today();S.days[t]=(S.days[t]||0)+1;if(S.last!==t){S.streak=S.last===yday()?S.streak+1:1;S.last=t}save()}
const nDay=()=>S.days[today()]||0,streak=()=>S.last===today()||S.last===yday()?S.streak:0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}

/* ===== VOICE ===== */
const TTS='speechSynthesis' in window,STT=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
function say(t,r){if(!TTS){toast('Text-to-speech is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||.9;applyV2(u);speechSynthesis.speak(u)}
function mic(cb,o){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){o.textContent='Speech recognition is not available in this browser. Use Chrome on Android with internet, or type your answer.';return}
let r;try{r=new R()}catch(e){o.textContent='Could not start the microphone.';return}
r.lang='en-US';r.onresult=e=>cb(e.results[0][0].transcript);
r.onerror=e=>{o.textContent=/not-allowed|service/.test(e.error)?'Microphone permission is blocked. Allow the microphone in Chrome site settings (lock icon). If this page is inside a preview window, open the link directly in Chrome.':e.error==='no-speech'?'No speech heard. Tap and try again.':e.error==='network'?'Speech recognition needs an internet connection.':'Microphone error: '+e.error};
o.textContent='Listening… speak now';try{r.start()}catch(e){o.textContent='Microphone is busy. Try again.'}}
const nw=s=>s.toLowerCase().replace(/’/g,"'").replace(/[^a-z' ]/g,'').split(/\s+/).filter(Boolean);
const sb=t=>`<button class="ic" data-t="${t}" onclick="say(this.dataset.t)" aria-label="Listen">🔊</button>`;

/* ===== SHARED UI ===== */
const lvc=()=>'<div class="chips">'+Object.keys(LV).map(k=>`<button class="chip ${S.lv===k?'on':''}" onclick="S.lv='${k}';vc='All';save();go()">${LV[k]}</button>`).join('')+'</div>';
function qhtml(q,z){return `<div class="card q" data-a="${q[2]}" data-w="${q[3]}" ${z?'data-z="1"':''}><p><b>${q[0]}</b></p>`+q[1].map((o,j)=>`<button class="o" onclick="pick(this,${j})">${o}</button>`).join('')+'<p class="fb"></p></div>'}
function pick(b,j){const q=b.parentNode;if(q.dataset.d)return;q.dataset.d=1;const a=+q.dataset.a,ok=j===a;q.querySelectorAll('.o')[a].classList.add('ok');if(!ok)b.classList.add('bad');q.querySelector('.fb').textContent=(ok?'✅ Correct! ':'❌ Not quite. ')+q.dataset.w;if(q.dataset.z)quizAfter(ok);else act()}

/* ===== VIEWS ===== */
const V={};let cur='home',sp={m:'t',s:null,t:0,tl:null,ts:0},vq='',vc='All',va=false,pr=null,gi=null,qz=null;
V.home=()=>{const n=nDay(),w=W[Math.floor(Date.now()/864e5)%W.length];return `<section class="hero"><h1>Speak English with confidence</h1><p>Five minutes a day. Listen, repeat and answer.</p><button class="b" onclick="startSp()">Start speaking</button></section>
<div class="card"><b>👋 Help us improve SpeakUp English</b><p>This app is new and growing. Please try it and tell us what works, what is confusing, and what you want to learn next.</p><button class="b" onclick="fbk()">Give Feedback</button><p><small>Please do not type passwords or payment details in the form.</small></p></div><h3>Your level</h3>${lvc()}
<div class="card"><b>Daily goal</b><div class="bar"><i style="width:${Math.min(100,n/S.goal*100)}%"></i></div><small>${n} of ${S.goal} activities today, ${streak()}-day streak</small></div>
<div class="card"><b>Free 7-day plan</b><p><small>${S.pl.length} of 7 days done</small></p><button class="b sm" onclick="go('plan')">Open today’s plan</button></div>
<div class="card"><small>Word of the day</small><div class="row" style="border:0;padding:0"><div><p class="big">${w[0]}</p><p>${w[2]}</p><p><i>${w[3]}</i></p></div>${sb(w[0]+'. '+w[3])}</div></div>
${wk()}<div class="grid"><button class="b" onclick="go('lessons')">Lessons</button><button class="b" onclick="go('vocab')">Vocabulary</button><button class="b" onclick="go('gram')">Grammar</button><button class="b" onclick="go('quiz')">Quizzes</button></div>`};
V.lessons=()=>`<h2>Lessons</h2>${lvc()}`+L.map((l,i)=>l[1]===S.lv?`<div class="card tap" onclick="openL(${i})"><b>${S.done.includes(i)?'✅ ':''}${l[0]}</b><p>${l[2]}</p></div>`:'').join('');
function openL(i){const l=L[i],d=S.done.includes(i);$('#v').innerHTML=`<button class="back" onclick="go('lessons')">← Lessons</button><h2>${l[0]}</h2><p>${l[2]}</p>`+l[3].map(p=>`<div class="row"><span>${p}</span>${sb(p)}</div>`).join('')+`<p><small>Listen, then say each sentence aloud three times. Use the Speaking tab for microphone practice.</small></p><button class="b" onclick="fin(${i})">${d?'Completed ✓ (tap to undo)':'Mark complete'}</button>`;scrollTo(0,0)}
function fin(i){const k=S.done.indexOf(i);if(k<0){S.done.push(i);act();toast('Lesson completed!')}else{S.done.splice(k,1);save()}openL(i)}
V.speak=()=>`<h2>Speaking</h2><div class="seg"><button class="${sp.m==='t'?'on':''}" onclick="sp.m='t';go()">Trainer</button><button class="${sp.m==='d'?'on':''}" onclick="sp.m='d';go()">Dialogues</button><button class="${sp.m==='r'?'on':''}" onclick="sp.m='r';go()">Listen and repeat</button></div>${vcard2()}<p class="note">This browser: listening ${TTS?'✅':'❌'}, speech recognition ${STT?'✅':'❌'}. Recognition needs internet and microphone permission. It shows the words the browser heard; it does not judge your pronunciation.</p>`+(sp.m==='t'?trn():sp.m==='d'?dlg():rep());
function dlg(){if(sp.s==null)return SC.map((s,i)=>`<div class="card tap" onclick="sp.s=${i};sp.t=0;go()"><b>${s[1]} ${s[0]}</b><p><small>3 short exchanges</small></p></div>`).join('');
const s=SC[sp.s],t=s[2][sp.t];return `<button class="back" onclick="sp.s=null;go()">← Scenarios</button><h3>${s[0]}, step ${sp.t+1} of 3</h3><div class="bub"><span>${t[0]}</span>${sb(t[0])}</div><textarea id="ans" rows="3" placeholder="Type your answer, or use the microphone"></textarea><div class="acts"><button class="b" onclick="mic(r=>{$('#ans').value=r;$('#mo').textContent='Heard: '+r},$('#mo'))">🎤 Speak</button><button class="b alt" onclick="$('#smp').hidden=false">Show sample</button></div><p id="mo" class="note"></p><div id="smp" class="card" hidden><small>Sample answer</small><div class="row" style="border:0;padding:0"><span>${t[1]}</span>${sb(t[1])}</div><small>Your own words are fine too.</small></div><button class="b" onclick="nxt()">${sp.t<2?'Next':'Finish'}</button>`}
function nxt(){if(sp.t<2)sp.t++;else{act();toast('Dialogue complete!');sp.s=null}go()}
function rep(){return RS.map((t,i)=>`<div class="card"><p><b>${t}</b></p><div class="acts"><button class="b sm" data-t="${t}" onclick="say(this.dataset.t)">🔊 Listen</button><button class="b sm alt" data-t="${t}" onclick="say(this.dataset.t,.55)">🐢 Slow</button><button class="b sm alt" onclick="rp(${i})">🎤 Repeat</button></div><p class="note" id="r${i}"></p></div>`).join('')}
function rp(i){const o=$('#r'+i);mic(h=>{const A=nw(RS[i]),B=nw(h);o.textContent=`Heard: “${h}”. ${A.filter(w=>B.includes(w)).length} of ${A.length} words matched. This is a text match only, not a pronunciation score.`;act()},o)}
function vlist(){const q=vq.toLowerCase(),r=W.filter(w=>vf(w)&&(vc==='All'||w[1]===vc)&&(w[0].includes(q)||w[2].includes(q)));return r.length?r.map(w=>`<div class="card"><div class="row" style="border:0;padding:0"><div><b>${w[0]}</b> <small>${w[1]}</small><p>${w[2]}</p><p><i>${w[3]}</i></p></div>${sb(w[0]+'. '+w[3])}</div></div>`).join(''):'<p class="note">No words found. Try another spelling or category.</p>'}

function trp(){const o=$('#rh'),g=TR[sp.tl][2][sp.ts][0];mic(h=>{const A=nw(g),B=nw(h),x=A.filter(w=>!B.includes(w));o.innerHTML=`Heard: “${h}”<br>${A.length-x.length} of ${A.length} words matched.`+(x.length?` Not heard: ${x.join(', ')}. Listen again and repeat more slowly.`:' Every word was heard. Well done!')+'<br>This compares written words only. It is not a pronunciation score.';act()},o)}
function chk(){const a=$('#ans').value.trim(),s=TR[sp.tl][2][sp.ts],f=[];if(!a){$('#fbk').innerHTML='<p class="fb">Type or say an answer first.</p>';return}
if(a.split(/\s+/).length<3)f.push('Try a full sentence with at least 3 words.');
if(!sv){if(/(^|[\s,])i(\s|'|’|$)/.test(a))f.push('Write “I” with a capital letter.');if(/^[a-z]/.test(a))f.push('Start your sentence with a capital letter.');if(!/[.!?]$/.test(a))f.push('End your sentence with . ! or ?')}
ER.forEach(e=>{if(e[0].test(a))f.push(e[1])});act();
$('#fbk').innerHTML=`<p class="fb">${f.length?'Suggestions':'✅ No common mistakes found'}</p>`+f.map(x=>`<p>${x}</p>`).join('')+`<div class="bub"><span><small>Example answer</small><br>${s[2]}</span>${sb(s[2])}</div><p><small>Tip: ${s[3]}</small></p><p class="note">These are basic automatic checks for common mistakes, not a full grammar check.</p>`}

const privH=()=>`<div class="card"><b>What this app stores</b><p>Your level, completed lessons, quiz scores, daily activity counts, streak, daily goal, plan progress and any feedback you save. It is stored in this browser on this device (local storage). If you sign in with Google, your progress (not your feedback notes) is also saved to your account in Google Firestore, and only your own signed-in account can read it. If you add profile details (display name, country, native language, learning goal or a small profile picture), they are saved the same way.</p></div><div class="card"><b>What it does not do</b><p>It has no payments, no ads and no analytics. Signing in with Google is optional. If you sign in, Google shares your name, email address and account ID with this app through Firebase Authentication. If you do not sign in, the app does not collect your name or email. It does not record or store your voice.</p></div><div class="card"><b>Third parties</b><p>The microphone feature uses your browser’s speech recognition. In Chrome on Android, your audio may be sent to the browser maker’s speech service, so it needs internet. Text-to-speech uses voices on your phone. The page loads a font from Google Fonts.</p></div><div class="card"><b>Your control</b><p>Use Reset progress on the Progress page to erase saved data. If you are signed in, it also clears the copy in your account. Clearing browser data removes the copy on this device.</p><p class="note">This is a plain-language summary for the prototype, not a legal policy. Get a proper privacy policy before launching to the public.</p></div>`;

async function pull(){try{if(!AM||!AM.f)return;if(S.uid&&S.uid!==AU.uid)S=Object.assign(D(),{lv:S.lv});S.uid=AU.uid;const s=await AM.f.getDoc(AM.f.doc(AM.db,'users',AU.uid));if(s.exists()){mergeS(JSON.parse(s.data().p));cst='Progress loaded from your account.'}else cst='Your progress will be saved to your account.';save();go()}catch(e){cst='Could not reach your account storage ('+(e.code||'error')+'). Your progress is still saved on this phone.';if(cur==='acct')go()}}

/* ===== INSTALLABLE APP (PWA): works only from your own website, not inside the Claude preview ===== */
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

function hdr(){const h=$('#hu');if(!h)return;h.innerHTML=AU?`<button class='chip' data-n='acct' style='padding:5px 10px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' onclick='go(this.dataset.n)'>👤 ${esc((AU.displayName||AU.email||'').split(' ')[0])}</button>`:`<button class='chip' style='padding:5px 12px' onclick='signIn()'>Sign in</button>`}
hdr();

/* ===== PROFILE + HEADER v2 ===== */
const nm=()=>((S.prof&&S.prof.name)||(AU&&(AU.displayName||AU.email))||'').split(' ')[0];
function avt(z){const p=S.prof&&S.prof.photo;return p&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p)?`<img src='${p}' alt='' style='width:${z}px;height:${z}px;border-radius:50%;object-fit:cover;vertical-align:middle'>`:`<span style='display:inline-flex;width:${z}px;height:${z}px;border-radius:50%;background:var(--pri);color:var(--onp);align-items:center;justify-content:center;font-weight:600;font-size:${Math.round(z*.5)}px;vertical-align:middle'>${esc((nm()[0]||'?').toUpperCase())}</span>`}
function hdr(){const h=$('#hu');if(!h)return;h.innerHTML=AU?`<button class='chip' data-n='acct' style='padding:4px 12px 4px 5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' onclick='go(this.dataset.n)'>${avt(26)} ${esc(nm())}</button>`:`<button class='chip' style='padding:6px 14px' onclick='signIn()'>Sign in</button>`}
function pickPhoto(i){const f=i.files&&i.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast('Please choose an image.');return}const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const c=document.createElement('canvas'),n=128,s=Math.min(m.width,m.height);c.width=c.height=n;c.getContext('2d').drawImage(m,(m.width-s)/2,(m.height-s)/2,s,s,0,0,n,n);S.prof=Object.assign({},S.prof,{photo:c.toDataURL('image/jpeg',.8)});save();hdr();go();toast('Picture updated.')};m.onerror=()=>toast('That image could not be read.');m.src=r.result};r.readAsDataURL(f)}
function rmPhoto(){S.prof=Object.assign({},S.prof,{photo:''});save();hdr();go()}
function saveProf(){const g=k=>($('#pf-'+k).value||'').trim().slice(0,60);S.prof=Object.assign({},S.prof,{name:g('name'),country:g('country'),lang:g('lang'),why:$('#pf-why').value});save();hdr();go();toast('Profile saved.')}
function acctIn(){const p=S.prof||{},W=['','Work','Travel','Study','Exams','Friends and family','Fun'],fi=(k,t,v)=>`<label><small>${t}</small><input id='pf-${k}' type='search' maxlength='60' value='${esc(v||'')}'></label>`;return `<h2>My account</h2><div class='card c'>${avt(96)}<p class='big' style='font-size:20px'>${esc(p.name||AU.displayName||'')}</p><small>${esc(AU.email)}</small><div class='acts' style='justify-content:center'><label class='b sm alt' style='cursor:pointer;margin:6px 6px 6px 0'>Change picture<input type='file' accept='image/*' hidden onchange='pickPhoto(this)'></label>${p.photo?`<button class='b sm alt' onclick='rmPhoto()'>Remove</button>`:''}</div></div><div class='card'><b>Your details</b><p><small>All optional. They are saved to your account and never shown to other learners.</small></p>${fi('name','Display name',p.name||AU.displayName)}${fi('country','Country',p.country)}${fi('lang','Your first language',p.lang)}<label><small>Why are you learning English?</small><select id='pf-why' style='width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0'>${W.map(x=>`<option value='${x}' ${p.why===x?'selected':''}>${x||'Choose one'}</option>`).join('')}</select></label><button class='b' onclick='saveProf()'>Save details</button></div><div class='card'><p class='note'>${esc(cst)||'Your progress is saved on this phone and synced to your account.'}</p><button class='b sm alt' onclick='push()'>Sync now</button></div><button class='b alt w' onclick='signOutU()'>Sign out</button>`}
const acctOld=V.acct;V.acct=()=>AU?acctIn():acctOld();
hdr();

/* ===== v2: honest account states, one feedback path, premium wording, privacy ===== */
var authReady=0;
function hasAuthKey(){try{return Object.keys(localStorage).some(k=>k.indexOf('firebase:authUser')===0)}catch(e){return false}}
setTimeout(()=>{authReady=1;hdr()},6000);
function acctState(){return AU?'auth':(S.nick?'local':'guest')}
function stLine(){const s=acctState();return s==='auth'?'✅ Signed in: '+esc(AU.email||AU.displayName):s==='local'?'Local profile “'+esc(S.nick)+'” (not signed in)':'Guest mode (not signed in)'}
function hdr(){const h=$('#hu');if(!h)return;h.innerHTML=AU?`<button class='chip' data-n='acct' style='padding:4px 12px 4px 5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' onclick='go(this.dataset.n)'>${avt(26)} ${esc(nm())}</button>`:(!authReady&&hasAuthKey())?`<button class='chip' disabled style='padding:6px 14px'>Checking…</button>`:`<button class='chip' style='padding:6px 14px' onclick='signIn()'>Sign in</button>`}
function stCard(){const T={auth:['✅ Signed in with Google','Google has confirmed your account. Progress is saved on this phone and synchronised to your account when you are online, so you can continue on another device.'],local:['Local profile (not signed in)','Your nickname and progress exist only on this phone. Nothing is synchronised. Sign in to keep progress across devices.'],guest:['Guest mode (not signed in)','Every free feature works. Progress is saved on this phone only and is lost if you clear browser data. Sign in to keep it across devices.']}[acctState()];return `<div class='card' style='border-color:var(--pri)'><b>${T[0]}</b><p><small>${T[1]}</small></p></div>`}
function saveNick(){S.nick=($('#nk').value||'').trim().slice(0,30);save();hdr();go();toast(S.nick?'Nickname saved on this phone.':'Nickname removed.')}
function acctOut(){return `<div class='card'><b>Local nickname (optional)</b><p><small>Shown only on this phone. It is not an account.</small></p><input id='nk' type='search' maxlength='30' value='${esc(S.nick||'')}' placeholder='Nickname'><button class='b sm' onclick='saveNick()'>Save nickname</button></div><div class='card'><b>Sign in with Google</b><p><small>Optional. Google confirms who you are, and we never see your Google password.</small></p><button class='b' onclick='signIn()'>Sign in with Google</button>${aerr?`<p class='fb' style='color:var(--bad)'>${esc(aerr)}</p>`:''}</div>`}
V.acct=()=>'<h2>Account</h2>'+stCard()+(AU?acctIn().replace('<h2>My account</h2>',''):acctOut());
function fbTab(){return `<div class='card'><b>Tell us what to improve</b><p><small>${formOk()?'This opens our Google Form in a new tab. What you type there goes to Google and the app owner.':'The online form is not set up yet. The app owner must supply a Google Form link that starts with https://docs.google.com/forms/ or https://forms.gle/.'}</small></p><button class='b' onclick='fbk()'>Give Feedback</button><p class='note'>Never enter passwords or payment details.</p></div><details style='margin:10px 0' ${fs.length?'open':''}><summary><b>Private notes on this phone</b></summary>${fform()}</details>`}
const privN=()=>[['Stored on this phone only','Your level, finished lessons, scores, streak, daily goal, plan progress, voice choice, a local nickname and private feedback notes, in your browser’s local storage. Why: to run the app and track your progress. Nothing here is sent anywhere unless you sign in (next card), and your nickname and private notes are never sent.'],['If you sign in with Google','Google shares your name, email address and account ID through Firebase Authentication so the app knows who you are. Your progress and any profile details you add (display name, country, first language, learning goal, a small picture) are saved in Google Firestore under your account, so they sync across devices. The rules let only your own signed-in account read them. The app owner can see stored data in the Firebase console.'],['Feedback form','Give Feedback opens a Google Form. What you type there is stored by Google Forms and read by the app owner. Private notes saved inside the app stay on this phone.'],['Voice and microphone','Listening uses voices on your phone. When you use speech recognition, Chrome may send your voice to its speech service to turn it into text, so it needs internet. This app does not record or store audio.'],['Other services','The page loads a font from Google Fonts, and your browser saves app files for install and offline use. There are no analytics, no ads and no tracking.'],['Not collected','Passwords (Google handles sign-in), payment details (nothing can be bought), location, contacts, or photos other than a picture you choose.'],['Your choices','Reset progress (Progress page) erases saved progress on this phone, and the cloud copy if you are signed in. Sign out returns the app to guest mode on this phone. Deleting the account itself is not built yet, so ask the app owner. Clearing browser data erases local data.'],['Legal status','This is a plain-language summary, not legal advice. The app has not been reviewed for compliance with any privacy law. A full privacy policy is needed before you promote it widely.']].map(x=>`<div class='card'><b>${x[0]}</b><p><small>${x[1]}</small></p></div>`).join('');
V.more=()=>`<h2>More</h2><div class='seg'>${[['f','Feedback'],['p','Privacy'],['r','Launch needs']].map(x=>`<button class='${mm===x[0]?'on':''}' onclick='mm="${x[0]}";go()'>${x[1]}</button>`).join('')}</div>`+(mm==='f'?fbTab():mm==='p'?privN():road());
function cmpT(){const R=[['Levelled lessons A1–C2','Included','Included'],['Speaking trainer (12 lessons)','Included','Included'],['Daily speaking practice and 7-day plan','Included','Included'],['Vocabulary, grammar and quizzes','Included','Included'],['Progress, streaks, optional Google sign-in sync','Included','Included'],['Advanced conversation lessons','3 samples','Planned'],['Job interview practice','3 samples','Planned'],['30-day speaking course','Outline only','Planned'],['Business English','Not built','Coming soon'],['AI conversation partner','Not built','Coming soon']];return `<div class='card' style='overflow-x:auto'><table class='tb'><tr><th>Feature</th><th>Free now</th><th>Planned Premium</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div><p class='note'>Included = works now. Samples and outline = small previews you can try today. Planned and Coming soon = not built. No prices are set, nothing can be bought, and no money is collected.</p>`}
const premL0=premL;premL=()=>`<div class='card'><b>Business English</b> <small>Coming soon</small><p><small>Meetings, emails, presentations and negotiation practice. Not built yet.</small></p></div>`+premL0();

const T=[['home','🏠','Home'],['lessons','📘','Lessons'],['speak','🎙️','Speaking'],['vocab','🔤','Vocabulary'],['gram','✏️','Grammar'],['quiz','🧠','Quizzes'],['prog','📈','Progress'],['plan','📅','Free plan'],['prem','⭐','Premium'],['more','ℹ️','More']];
$('#nav').innerHTML=T.filter(t=>NAVM.includes(t[0])).map(t=>`<button data-n="${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
function go(n){if(n&&n!==cur){cur=n;scrollTo(0,0)}$('#v').innerHTML=V[cur]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===cur));$('#lvb').textContent=LV[S.lv]}
