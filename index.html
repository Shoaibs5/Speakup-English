<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp English</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b3d91"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#0f2a4a;--mut:#5a6f8c;--pri:#1565d8;--pri2:#0b3d91;--line:#d6e2f5;--ok:#17803f;--bad:#c93a3a;--sf:#eaf2ff;--onp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1626;--card:#13233b;--ink:#e8f0ff;--mut:#9db3d3;--pri:#5aa0ff;--pri2:#123a7a;--line:#25405f;--ok:#4cc784;--bad:#ff8080;--sf:#183050;--onp:#06182f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1626;--card:#13233b;--ink:#e8f0ff;--mut:#9db3d3;--pri:#5aa0ff;--pri2:#123a7a;--line:#25405f;--ok:#4cc784;--bad:#ff8080;--sf:#183050;--onp:#06182f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Lexend,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri2);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pri2);color:#fff;padding:12px 16px;font-weight:600;font-size:18px;z-index:5}
header span{font-weight:400;opacity:.85;font-size:13px;margin-left:8px}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h2{margin:8px 0 12px;font-size:22px}h3{margin:18px 0 8px;font-size:17px}p{margin:6px 0}small,.note{color:var(--mut);font-size:13px}
.hero{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:18px;padding:22px}
.hero h1{margin:0 0 6px;font-size:24px;line-height:1.25}.hero p{opacity:.92}.hero .b{background:#fff;color:#0b3d91;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.tap{cursor:pointer}.c{text-align:center}.big{font-size:26px;font-weight:600;margin:4px 0}
.b{background:var(--pri);color:var(--onp);border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;min-height:44px;cursor:pointer;margin:6px 6px 6px 0}
.alt{background:var(--sf);color:var(--pri)}.w{width:100%;margin-right:0}.sm{padding:8px 12px;min-height:40px;font-size:14px}
.ic{background:var(--sf);border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;padding:8px 0;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.bub{background:var(--sf);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}
textarea,input[type=search]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.chips,.seg,.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip,.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on,.seg button.on{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.bar{height:10px;background:var(--sf);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.grid,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .b{margin:0}.grid2 .card{margin:0}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:inherit;min-height:44px;cursor:pointer}
.o.ok{border-color:var(--ok);background:var(--sf)}.o.bad{border-color:var(--bad)}.fb{font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:8px 4px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pri2);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:20;max-width:88%}
table.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}.tb td:first-child,.tb th:first-child{text-align:left}
.b.sm{min-height:44px}.chip,.seg button{min-height:42px}.ic{width:44px;height:44px}html,body{overflow-x:hidden}.row span,.card p,.card b{overflow-wrap:anywhere}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.dot{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12px;padding:0;min-height:0;cursor:pointer}.dot.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}.dot.dn{background:var(--pri);color:var(--onp)}.b:disabled{opacity:.45}details>summary{min-height:36px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
</style></head><body>
<header style="display:flex;align-items:center;gap:8px;white-space:nowrap"><button onclick="menu()" aria-label="Menu" style="background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:2px 8px 2px 0;cursor:pointer">☰</button><span>SpeakUp English</span><span id="lvb" style="display:none"></span><span id="hu" style="margin-left:auto"></span></header>
<main id="v"></main><nav id="nav"></nav><div id="toast" role="status"></div>
<script>
/* ===== CONTENT (edit or replace later with files or a server) ===== */
const LV={A:'Beginner A1–A2',B:'Intermediate B1–B2',C:'Advanced C1–C2'};
const L=[
['Greetings','A','Say hello and goodbye politely at any time of day.',['Good morning! How are you?','Nice to meet you.','See you tomorrow.']],
['Introducing Yourself','A','Share your name, country and job in simple sentences.',['My name is Sara, and I am from Egypt.','I work as a teacher.','I am learning English.']],
['Numbers, Time and Dates','A','Ask and tell the time and talk about prices.',['What time is it?','The class starts at half past nine.','How much is this?']],
['Shopping','A','Ask about prices, sizes and ways to pay.',['Do you have this in a larger size?','Can I pay by card?','I will take it, please.']],
['Ordering Food','B','Order politely and solve small problems in a restaurant.',['I would like the chicken, please.','Could we have the bill, please?','This is not what I ordered.']],
['Travel and Directions','B','Find your way and handle problems when you travel.',['Excuse me, how do I get to the station?','Is this seat taken?','My flight has been delayed.']],
['Talking About the Past','B','Tell short stories with past tenses.',['Yesterday I visited my cousin.','I had never tried sushi before.','While I was walking, it started to rain.']],
['Job Interviews','B','Describe your experience and strengths with confidence.',['I have three years of experience in sales.','My greatest strength is solving problems calmly.','I would like to grow with your company.']],
['Giving Opinions','C','Express and defend a view with nuance.',['From my perspective, remote work boosts productivity.','I see your point, but I would argue otherwise.','That said, the evidence is mixed.']],
['Idioms and Nuance','C','Sound more natural with common idioms.',['Let’s call it a day.','It is a piece of cake.','I am feeling under the weather today.']]];
const W=`breakfast|Daily life|the first meal of the day|I eat breakfast at seven.
neighbour|Daily life|a person who lives near you|My neighbour is very kind.
schedule|Daily life|a plan of times for activities|My schedule is busy today.
borrow|Daily life|to take something and give it back later|Can I borrow your pen?
tired|Feelings|needing rest or sleep|I am tired after work.
excited|Feelings|very happy about something coming|She is excited about the trip.
nervous|Feelings|a little afraid or worried|I feel nervous before interviews.
proud|Feelings|happy about what you or others did|He is proud of his son.
ticket|Travel|a document that lets you travel|I bought a train ticket.
luggage|Travel|the bags you take on a trip|Our luggage is heavy.
passport|Travel|an official ID for foreign travel|Please show your passport.
delay|Travel|a time when something is late|There is a delay of one hour.
receipt|Shopping|a paper that shows what you paid|Keep the receipt.
discount|Shopping|a lower price|They offer a ten percent discount.
cashier|Shopping|a person who takes your payment|Please pay the cashier.
refund|Shopping|money returned to you|I asked for a refund.
menu|Food|a list of dishes in a restaurant|Can I see the menu?
delicious|Food|tasting very good|The soup is delicious.
bill|Food|the paper showing what to pay|Could we have the bill?
vegetarian|Food|a person who does not eat meat|I am vegetarian.
colleague|Work|a person you work with|My colleague helped me.
deadline|Work|the last time to finish something|The deadline is Friday.
resume|Work|a document about your jobs and skills|I sent my resume yesterday.
promotion|Work|a move to a better job|She got a promotion.
reliable|Advanced|able to be trusted|He is a reliable partner.
reluctant|Advanced|not willing to do something|I was reluctant to agree.
ambiguous|Advanced|having more than one meaning|The answer was ambiguous.
elaborate|Advanced|to explain with more detail|Could you elaborate?
thrive|Advanced|to grow and do very well|Plants thrive in sunlight.
inevitable|Advanced|certain to happen|Change is inevitable.`.split('\n').map(x=>x.split('|'));
const SC=[
['Introductions','👋',[['Hi! I don’t think we have met. What’s your name?','Hi, I’m Ali. Nice to meet you.'],['Where are you from?','I’m from Brazil.'],['What do you do?','I’m a student, and I’m learning English.']]],
['Shopping','🛍️',[['Hello! Can I help you?','Yes, please. I’m looking for a blue jacket.'],['What size do you need?','Medium, please. How much is it?'],['It’s forty dollars.','That sounds good. Can I pay by card?']]],
['At a Restaurant','🍽️',[['Good evening. Are you ready to order?','Yes, I’d like the pasta and a glass of water.'],['Would you like anything else?','No, thank you. That’s all for now.'],['Here is your food. Enjoy!','Thank you. Could we have the bill, please?']]],
['Travel at the Airport','✈️',[['Good morning. May I see your passport?','Of course. Here you are.'],['What is the purpose of your visit?','I’m here on holiday for two weeks.'],['Enjoy your stay!','Thank you very much.']]],
['Job Interview','💼',[['Tell me a little about yourself.','I’m a hard-working person with two years of experience in customer service.'],['Why do you want this job?','I enjoy working with people, and I want to learn and grow.'],['Do you have any questions for us?','Yes. What does a typical day in this role look like?']]]];
const RS=['The weather is lovely today.','Could you speak more slowly, please?','I would like a cup of tea.','Where is the nearest bus stop?','I have lived here for three years.','Thank you for your help.'];
const G=[
['Tenses','⏱️','<b>Present simple</b> is for habits: I work. <b>Present continuous</b> is for now: I am working. <b>Past simple</b> is for finished actions: I worked. <b>Present perfect</b> links past and now: I have worked here for a year.',[['She ___ to school every day.',['go','goes','is go'],1,'Habits use present simple, and he/she/it adds -s.'],['I ___ dinner right now.',['cook','am cooking','cooked'],1,'“Right now” needs present continuous.']]],
['Sentence Structure','🧱','Basic order is <b>Subject + Verb + Object</b>: I like tea. Questions use <b>Auxiliary + Subject + Verb</b>: Do you like tea? Put time and place at the end.',[['Choose the correct order.',['Like I tea','I like tea','Tea like I'],1,'English uses Subject + Verb + Object.'],['Choose the correct question.',['You do like tea?','Do you like tea?','Like you tea?'],1,'Questions begin with the auxiliary do/does.']]],
['Articles','📰','Use <b>a</b> before consonant sounds, <b>an</b> before vowel sounds, and <b>the</b> for something specific or unique. Use no article for general plurals: I like dogs.',[['She has ___ apple.',['a','an','the'],1,'“Apple” starts with a vowel sound, so use an.'],['I saw ___ moon last night.',['a','an','the'],2,'There is only one moon, so use the.']]],
['Prepositions','📍','<b>Time:</b> at 5 pm, on Monday, in July. <b>Place:</b> at the door, on the table, in the box.',[['The class is ___ Monday.',['at','on','in'],1,'Days use on.'],['We meet ___ 6 pm.',['at','on','in'],0,'Exact times use at.']]],
['Common Mistakes','⚠️','Say “I am 20 years old”, not “I have 20 years”. Use <b>many</b> with countable nouns and <b>much</b> with uncountable nouns. Say “He doesn’t”, not “He don’t”.',[['He ___ like coffee.',['don’t','doesn’t','not'],1,'He/she/it uses doesn’t.'],['I have ___ friends here.',['much','many','little'],1,'Friends are countable, so use many.']]]];
const Q=[
['Choose the correct sentence.',['She go to work.','She goes to work.','She going to work.'],1,'He/she/it adds -s in present simple.'],
['“Could I have the bill?” Where would you say this?',['At a restaurant','At a bank','At a school'],0,'You ask for the bill after a meal.'],
['Which word means almost the same as “delicious”?',['tasty','boring','late'],0,'Tasty also means good to eat.'],
['I ___ here since 2020.',['live','have lived','am living'],1,'Since + a starting point uses present perfect.'],
['Choose the article: ___ hour',['a','an','the'],1,'“Hour” starts with a vowel sound because the h is silent.'],
['The meeting is ___ 3 pm.',['on','at','in'],1,'Exact times use at.'],
['What does “reluctant” mean?',['eager','unwilling','tired'],1,'Reluctant means not willing.'],
['Best reply to “Nice to meet you.”',['Nice to meet you too.','I’m fine, thanks.','See you later.'],0,'Return the same greeting.'],
['“Under the weather” means…',['feeling slightly ill','standing outside','very happy'],0,'It is an idiom for feeling unwell.'],
['Which sentence is the most polite?',['Give me water.','I want water.','Could I have some water, please?'],2,'“Could I… please?” is polite.']];

/* ===== STATE (saved in this browser only; replace save() with a cloud call later) ===== */
const D=()=>({done:[],tr:[],pl:[],c30:[],fb:[],best:null,scores:[],days:{},streak:0,last:'',lv:'A',goal:5});
/* Store: swap for cloud sync + sign-in later. Access: later set from a server-verified subscription. */
const Store={load(){try{return JSON.parse(localStorage.getItem('su')||'{}')}catch(e){return{}}},save(s){try{localStorage.setItem('su',JSON.stringify(s))}catch(e){}}};
const Access={previewUnlocked:true,canUse:()=>Access.previewUnlocked};
let S=Object.assign(D(),Store.load());
const save=()=>{Store.save(S);cloudQ()};
const $=s=>document.querySelector(s),ld=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ld(new Date()),yday=()=>ld(new Date(Date.now()-864e5));
function act(){const t=today();S.days[t]=(S.days[t]||0)+1;if(S.last!==t){S.streak=S.last===yday()?S.streak+1:1;S.last=t}save()}
const nDay=()=>S.days[today()]||0,streak=()=>S.last===today()||S.last===yday()?S.streak:0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}

/* ===== VOICE ===== */
const TTS='speechSynthesis' in window,STT=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
function say(t,r){if(!TTS){toast('Text-to-speech is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||.9;applyV2(u);speechSynthesis.speak(u)}
function mic(cb,o){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){o.textContent='Speech recognition is not available in this browser. Use Chrome on Android with internet, or type your answer.';return}
let r;try{r=new R()}catch(e){o.textContent='Could not start the microphone.';return}
r.lang='en-US';r.onresult=e=>cb(e.results[0][0].transcript);
r.onerror=e=>{o.textContent=/not-allowed|service/.test(e.error)?'Microphone permission is blocked. Allow the microphone in Chrome site settings (lock icon). If this page is inside a preview window, open the link directly in Chrome.':e.error==='no-speech'?'No speech heard. Tap and try again.':e.error==='network'?'Speech recognition needs an internet connection.':'Microphone error: '+e.error};
o.textContent='Listening… speak now';try{r.start()}catch(e){o.textContent='Microphone is busy. Try again.'}}
const nw=s=>s.toLowerCase().replace(/’/g,"'").replace(/[^a-z' ]/g,'').split(/\s+/).filter(Boolean);
const sb=t=>`<button class="ic" data-t="${t}" onclick="say(this.dataset.t)" aria-label="Listen">🔊</button>`;

/* ===== SHARED UI ===== */
const lvc=()=>'<div class="chips">'+Object.keys(LV).map(k=>`<button class="chip ${S.lv===k?'on':''}" onclick="S.lv='${k}';vc='All';save();go()">${LV[k]}</button>`).join('')+'</div>';
function qhtml(q,z){return `<div class="card q" data-a="${q[2]}" data-w="${q[3]}" ${z?'data-z="1"':''}><p><b>${q[0]}</b></p>`+q[1].map((o,j)=>`<button class="o" onclick="pick(this,${j})">${o}</button>`).join('')+'<p class="fb"></p></div>'}
function pick(b,j){const q=b.parentNode;if(q.dataset.d)return;q.dataset.d=1;const a=+q.dataset.a,ok=j===a;q.querySelectorAll('.o')[a].classList.add('ok');if(!ok)b.classList.add('bad');q.querySelector('.fb').textContent=(ok?'✅ Correct! ':'❌ Not quite. ')+q.dataset.w;if(q.dataset.z)quizAfter(ok);else act()}

/* ===== VIEWS ===== */
const V={};let cur='home',sp={m:'t',s:null,t:0,tl:null,ts:0},vq='',vc='All',va=false,pr=null,gi=null,qz=null;
V.home=()=>{const n=nDay(),w=W[Math.floor(Date.now()/864e5)%W.length];return `<section class="hero"><h1>Speak English with confidence</h1><p>Five minutes a day. Listen, repeat and answer.</p><button class="b" onclick="startSp()">Start speaking</button></section>
<div class="card"><b>👋 Help us improve SpeakUp English</b><p>This app is new and growing. Please try it and tell us what works, what is confusing, and what you want to learn next.</p><button class="b" onclick="fbk()">Give Feedback</button><p><small>Please do not type passwords or payment details in the form.</small></p></div><h3>Your level</h3>${lvc()}
<div class="card"><b>Daily goal</b><div class="bar"><i style="width:${Math.min(100,n/S.goal*100)}%"></i></div><small>${n} of ${S.goal} activities today, ${streak()}-day streak</small></div>
<div class="card"><b>Free 7-day plan</b><p><small>${S.pl.length} of 7 days done</small></p><button class="b sm" onclick="go('plan')">Open today’s plan</button></div>
<div class="card"><small>Word of the day</small><div class="row" style="border:0;padding:0"><div><p class="big">${w[0]}</p><p>${w[2]}</p><p><i>${w[3]}</i></p></div>${sb(w[0]+'. '+w[3])}</div></div>
${wk()}<div class="grid"><button class="b" onclick="go('lessons')">Lessons</button><button class="b" onclick="go('vocab')">Vocabulary</button><button class="b" onclick="go('gram')">Grammar</button><button class="b" onclick="go('quiz')">Quizzes</button></div>`};
V.lessons=()=>`<h2>Lessons</h2>${lvc()}`+L.map((l,i)=>l[1]===S.lv?`<div class="card tap" onclick="openL(${i})"><b>${S.done.includes(i)?'✅ ':''}${l[0]}</b><p>${l[2]}</p></div>`:'').join('');
function openL(i){const l=L[i],d=S.done.includes(i);$('#v').innerHTML=`<button class="back" onclick="go('lessons')">← Lessons</button><h2>${l[0]}</h2><p>${l[2]}</p>`+l[3].map(p=>`<div class="row"><span>${p}</span>${sb(p)}</div>`).join('')+`<p><small>Listen, then say each sentence aloud three times. Use the Speaking tab for microphone practice.</small></p><button class="b" onclick="fin(${i})">${d?'Completed ✓ (tap to undo)':'Mark complete'}</button>`;scrollTo(0,0)}
function fin(i){const k=S.done.indexOf(i);if(k<0){S.done.push(i);act();toast('Lesson completed!')}else{S.done.splice(k,1);save()}openL(i)}
V.speak=()=>`<h2>Speaking</h2><div class="seg"><button class="${sp.m==='t'?'on':''}" onclick="sp.m='t';go()">Trainer</button><button class="${sp.m==='d'?'on':''}" onclick="sp.m='d';go()">Dialogues</button><button class="${sp.m==='r'?'on':''}" onclick="sp.m='r';go()">Listen and repeat</button></div>${vcard2()}<p class="note">This browser: listening ${TTS?'✅':'❌'}, speech recognition ${STT?'✅':'❌'}. Recognition needs internet and microphone permission. It shows the words the browser heard; it does not judge your pronunciation.</p>`+(sp.m==='t'?trn():sp.m==='d'?dlg():rep());
function dlg(){if(sp.s==null)return SC.map((s,i)=>`<div class="card tap" onclick="sp.s=${i};sp.t=0;go()"><b>${s[1]} ${s[0]}</b><p><small>3 short exchanges</small></p></div>`).join('');
const s=SC[sp.s],t=s[2][sp.t];return `<button class="back" onclick="sp.s=null;go()">← Scenarios</button><h3>${s[0]}, step ${sp.t+1} of 3</h3><div class="bub"><span>${t[0]}</span>${sb(t[0])}</div><textarea id="ans" rows="3" placeholder="Type your answer, or use the microphone"></textarea><div class="acts"><button class="b" onclick="mic(r=>{$('#ans').value=r;$('#mo').textContent='Heard: '+r},$('#mo'))">🎤 Speak</button><button class="b alt" onclick="$('#smp').hidden=false">Show sample</button></div><p id="mo" class="note"></p><div id="smp" class="card" hidden><small>Sample answer</small><div class="row" style="border:0;padding:0"><span>${t[1]}</span>${sb(t[1])}</div><small>Your own words are fine too.</small></div><button class="b" onclick="nxt()">${sp.t<2?'Next':'Finish'}</button>`}
function nxt(){if(sp.t<2)sp.t++;else{act();toast('Dialogue complete!');sp.s=null}go()}
function rep(){return RS.map((t,i)=>`<div class="card"><p><b>${t}</b></p><div class="acts"><button class="b sm" data-t="${t}" onclick="say(this.dataset.t)">🔊 Listen</button><button class="b sm alt" data-t="${t}" onclick="say(this.dataset.t,.55)">🐢 Slow</button><button class="b sm alt" onclick="rp(${i})">🎤 Repeat</button></div><p class="note" id="r${i}"></p></div>`).join('')}
function rp(i){const o=$('#r'+i);mic(h=>{const A=nw(RS[i]),B=nw(h);o.textContent=`Heard: “${h}”. ${A.filter(w=>B.includes(w)).length} of ${A.length} words matched. This is a text match only, not a pronunciation score.`;act()},o)}

${wk()}<div class="card"><b>Daily goal: ${n} of ${S.goal} activities</b><div class="bar"><i style="width:${Math.min(100,n/S.goal*100)}%"></i></div><div class="chips">${[3,5,10].map(g=>`<button class="chip ${S.goal===g?'on':''}" onclick="S.goal=${g};save();go()">${g} a day</button>`).join('')}</div><small>An activity is a finished lesson, dialogue, repeat try, grammar answer, practice round or quiz.</small></div>
<div class="card"><b>Recent quiz scores</b><p>${S.scores.length?S.scores.slice(-5).join(', '):'No quizzes yet.'}</p></div>
<div class="card"><b>About your data</b><p><small>Progress is saved only in this browser on this phone (local storage). It is not backed up or shared. Clearing browser data or using private mode can erase it. If you sign in with Google, progress is also saved to your account.</small></p><button class="b alt" onclick="rst(this)">Reset progress</button></div>`};

const TR=[
['Introductions','A',[['Hello, my name is Sara. Nice to meet you.','Introduce yourself: say your name and your country.','Hello, my name is Ali. I am from Brazil.','Say “I am from…” for your country.'],['I work as a teacher in a small school.','What is your job?','I am a student.','Use “a” before a job: I am a nurse.']]],
['Shopping','A',[['How much is this jacket?','Ask the price of a shirt.','How much is this shirt?','Use “How much” for prices and “How many” for numbers.'],['Do you have this in a larger size?','Ask for a smaller size.','Do you have this in a smaller size?','“Do you have…?” is polite and clear.']]],
['Restaurant Orders','A',[['I would like a glass of water, please.','Order a cup of tea politely.','I would like a cup of tea, please.','“I would like” sounds more polite than “I want”.'],['Could we have the bill, please?','Ask for the bill.','Could I have the bill, please?','Use “Could” for polite requests.']]],
['Asking for Directions','A',[['Excuse me, where is the bus station?','Ask where the train station is.','Excuse me, where is the train station?','Start with “Excuse me” to get attention politely.'],['I would like a ticket to London, please.','Ask for a ticket to your city.','I would like a ticket to Paris, please.','Use “a ticket to + place”.']]],
['Restaurant Problems','B',[['Excuse me, this is not what I ordered.','Say your soup is cold and ask for help.','Excuse me, my soup is cold. Could you heat it, please?','Say “Excuse me”, the problem, then “Could you…?”.'],['Do you have any vegetarian dishes?','Ask for dishes without meat.','Do you have any vegetarian dishes?','Use “any” in questions.']]],
['Job Interview','B',[['I have three years of experience in customer service.','Describe your work experience.','I have two years of experience in sales.','Use “I have” + number of years + “of experience”.'],['My greatest strength is solving problems calmly.','What is your greatest strength?','My greatest strength is working well in a team.','After “is”, use an -ing form: My strength is learning fast.']]],
['Workplace Meeting','B',[['Could we move the meeting to Thursday?','Ask to move a meeting to Friday.','Could we move the meeting to Friday morning?','“Could we…?” is a polite suggestion at work.'],['I will send you the report by tomorrow.','Promise to send a file by Monday.','I will send you the file by Monday.','Use “will” for promises and “by” for deadlines.']]],
['Travel Problems','B',[['My luggage is missing. Could you help me?','Say your flight is delayed and ask for help.','My flight is delayed. Could you help me, please?','Say the problem first, then ask for help.'],['Could you tell me how to get to the hotel?','Ask how to get to your hotel.','Could you tell me how to get to the Grand Hotel?','After “Could you tell me”, use normal word order: how to get.']]],
['Making Friends','B',[['Would you like to have coffee this weekend?','Invite a friend to lunch.','Would you like to have lunch with me on Saturday?','“Would you like to…?” is a friendly invitation.'],['What do you do in your free time?','Talk about your hobbies.','In my free time, I play football and read books.','Use present simple for hobbies and routines.']]],
['Polite Disagreement','C',[['I see your point, but I have a different view.','Disagree politely with a colleague’s plan.','I see your point, but I think we should wait.','Acknowledge first, then give your view.'],['Could you elaborate on that?','Ask a colleague for more detail.','Could you elaborate on the budget?','“Elaborate on” is a formal way to ask for more detail.']]],
['Negotiating','C',[['I would agree if you could lower the price.','Say you can agree if the deadline changes.','I would agree if you could extend the deadline.','Use “would… if…” for polite conditions.'],['Let me think about it and get back to you.','Say you need time to decide.','I need more time. I will get back to you tomorrow.','“Get back to you” means reply later.']]],

const ER=[[/\bi am agree\b/i,'Say “I agree”, not “I am agree”.'],[/\b(he|she|it) (don[’']t|have)\b/i,'With he/she/it, use “doesn’t” and “has”.'],[/\bi am (go|work|live|study|eat|play)\b/i,'After “I am”, use an -ing verb (I am working), or drop “am” (I work).'],[/\bmore better\b/i,'Say “better”, not “more better”.'],[/\bi want\b/i,'“I want” can sound too direct. Try “I would like”.'],[/\bi have \d+ years\b(?! of)/i,'For age, say “I am 20 years old”.']];
let sv=0;
function startSp(){sp.m='t';const i=TR.findIndex((t,k)=>t[1]===S.lv&&!S.tr.includes(k));sp.tl=i<0?TR.findIndex(t=>t[1]===S.lv):i;sp.ts=0;go('speak')}
function trn(){if(sp.tl==null)return lvc()+TR.map((t,i)=>t[1]===S.lv?`<div class="card tap" onclick="sp.tl=${i};sp.ts=0;go()"><b>${S.tr.includes(i)?'✅ ':''}${t[0]}</b><p><small>${t[2].length} sentences with practice questions</small></p></div>`:'').join('');
const t=TR[sp.tl],s=t[2][sp.ts];sv=0;return `<button class="back" onclick="sp.tl=null;go()">← Speaking lessons</button><h3>${t[0]}, sentence ${sp.ts+1} of ${t[2].length}</h3><div class="card"><small>Step 1: listen and repeat</small><p style="font-size:20px;font-weight:600">${s[0]}</p><div class="acts"><button class="b sm" data-t="${s[0]}" onclick="say(this.dataset.t)">🔊 Listen</button><button class="b sm alt" data-t="${s[0]}" onclick="say(this.dataset.t,.55)">🐢 Slow</button><button class="b sm alt" onclick="trp()">🎤 Repeat</button></div><p class="note" id="rh"></p></div><div class="card"><small>Step 2: practice question</small><p><b>${s[1]}</b></p><textarea id="ans" rows="2" oninput="sv=0" placeholder="Type your answer, or use the microphone"></textarea><div class="acts"><button class="b sm alt" onclick="mic(r=>{$('#ans').value=r;sv=1;$('#mo').textContent='Heard: '+r},$('#mo'))">🎤 Speak answer</button><button class="b sm" onclick="chk()">Check my answer</button></div><p class="note" id="mo"></p><div id="fbk"></div></div><button class="b" onclick="tnx()">${sp.ts<t[2].length-1?'Next sentence':'Finish lesson'}</button>`}
function trp(){const o=$('#rh'),g=TR[sp.tl][2][sp.ts][0];mic(h=>{const A=nw(g),B=nw(h),x=A.filter(w=>!B.includes(w));o.innerHTML=`Heard: “${h}”<br>${A.length-x.length} of ${A.length} words matched.`+(x.length?` Not heard: ${x.join(', ')}. Listen again and repeat more slowly.`:' Every word was heard. Well done!')+'<br>This compares written words only. It is not a pronunciation score.';act()},o)}
function chk(){const a=$('#ans').value.trim(),s=TR[sp.tl][2][sp.ts],f=[];if(!a){$('#fbk').innerHTML='<p class="fb">Type or say an answer first.</p>';return}
if(a.split(/\s+/).length<3)f.push('Try a full sentence with at least 3 words.');
if(!sv){if(/(^|[\s,])i(\s|'|’|$)/.test(a))f.push('Write “I” with a capital letter.');if(/^[a-z]/.test(a))f.push('Start your sentence with a capital letter.');if(!/[.!?]$/.test(a))f.push('End your sentence with . ! or ?')}
ER.forEach(e=>{if(e[0].test(a))f.push(e[1])});act();
$('#fbk').innerHTML=`<p class="fb">${f.length?'Suggestions':'✅ No common mistakes found'}</p>`+f.map(x=>`<p>${x}</p>`).join('')+`<div class="bub"><span><small>Example answer</small><br>${s[2]}</span>${sb(s[2])}</div><p><small>Tip: ${s[3]}</small></p><p class="note">These are basic automatic checks for common mistakes, not a full grammar check.</p>`}
function tnx(){const t=TR[sp.tl];scrollTo(0,0);if(sp.ts<t[2].length-1){sp.ts++}else{if(!S.tr.includes(sp.tl))S.tr.push(sp.tl);act();toast('Speaking lesson complete!');sp.tl=null}go()}

['At the airport','✈️',[`Good morning. May I see your passport?|Of course. Here you are.|Yes, here is my passport.|Sure, here it is.~Do you have any bags to check in?|Yes, I have one suitcase.|Yes, one bag, please.|No, only this small bag.~Here is your boarding pass. Your gate is B12.|Thank you. Where is gate B12?|Thanks. What time does boarding start?`,`Where are you flying to today, and are you travelling alone?|I’m flying to London, and I’m travelling alone.|I’m going to Dubai with my family.~Would you prefer a window or an aisle seat?|A window seat, please.|An aisle seat, if possible, please.~I’m sorry, your flight is delayed by one hour.|Thank you for telling me. Is there a lounge I can wait in?|That’s fine. Where can I get something to eat?`,`Could you tell me the purpose of your trip and how long you plan to stay?|I’m here on business for a week.|I’m visiting family and staying for two weeks.~I’m afraid your suitcase is slightly overweight. There’s a fee, or you could move items to your hand luggage.|I’ll move a few items to my hand luggage.|How much is the fee, please?~Your connecting flight is tight. I’d recommend heading straight to the gate.|Understood. Which way is the fastest route to the gate?|Thank you for the advice. I’ll go there now.`],'Check-in agent'],
['Asking for directions','🧭',[`Hello! Can I help you?|Excuse me, where is the bus station?|Yes, please. Where is the train station?|Excuse me, I’m lost.~Go straight, then turn left at the bank.|Thank you. Is it far?|Thanks. How far is it?~No, it’s about five minutes on foot.|Great, thank you very much.|Thanks for your help.`,`You look lost. Where are you trying to get to?|I’m trying to find the city museum.|I’m looking for the nearest pharmacy.~It’s a bit far to walk. You could take bus number twelve from the corner.|Where is the bus stop exactly?|How long does the bus take?~The stop is opposite the post office. You can’t miss it.|Thank you, that’s very helpful.|Great, I’ll head there now.`,`Sorry, I’m not from around here, but I think the library is down that street.|Thanks anyway. Do you know someone who could help?|No problem. I’ll ask someone else.~If you cross the bridge and take the second turning on the right, you’ll see it on your left.|Let me make sure: cross the bridge, then the second right?|Thank you. Could you repeat that, please?~That’s right. It should take roughly ten minutes if you keep a steady pace.|Perfect, thank you so much for your time.|Great. I really appreciate your help.`],'Local person'],
['Meeting someone','👋',[`Hi! I’m Anna. What’s your name?|Hi, I’m Ali. Nice to meet you.|My name is Ali. Nice to meet you.|Hello, I’m Ali.~Nice to meet you too. Where are you from?|I’m from Brazil.|I come from Egypt.|I’m from India.~What do you do?|I’m a student.|I work as a teacher.|I’m an engineer.`,`Hello, I don’t think we’ve met. I’m Daniel.|Nice to meet you, Daniel. I’m Sara.|Pleased to meet you. My name’s Sara.~So what brings you to this event?|A friend invited me, and I wanted to meet new people.|I’m here for work, and I’m interested in networking.~That sounds great. We should keep in touch.|Definitely. Could I have your number?|I’d like that. Are you on social media?`,`It’s a pleasure to finally meet you. I’ve heard a lot about your work.|Likewise. I’ve been looking forward to meeting you.|That’s kind of you. I hope it was all good.~How did you get into your line of work?|I started as a trainee and developed my skills over time.|It was a natural step after my studies.~I’d love to continue this conversation over coffee sometime.|That sounds lovely. Let me give you my card.|I’d like that. Let’s arrange it for next week.`],'New acquaintance'],
['At a job interview','💼',[`Good morning. Please have a seat. Tell me about yourself.|I’m a hard-working person with two years of experience.|My name is Ali, and I have experience in sales.|I’m a graduate, and I’m a quick learner.~Why do you want this job?|I enjoy working with people and want to learn.|I think this job is a good chance to grow.|I like your company and want to work here.~Do you have any questions for us?|Yes, what are the working hours?|Yes, what does a typical day look like?|No, thank you. Thank you for your time.`,`Thank you for coming in. Could you walk me through your work experience?|I spent three years in customer service, where I handled complaints.|I’ve worked in sales for two years and exceeded my targets.~What would you say is your greatest strength?|My greatest strength is staying calm under pressure.|I’m very organised and I work well in a team.~Can you describe a challenge you faced and how you handled it?|We missed a deadline, so I made a plan and we finished on time.|A customer was upset, so I listened and solved the problem.`,`Your CV is impressive. What distinguishes you from other candidates?|I combine strong technical skills with clear communication.|My track record of delivering results under tight deadlines.~Where do you see yourself in five years?|I hope to be leading a small team.|I’d like to grow into a senior role and keep learning.~We have a few other candidates. Is there anything else we should know?|I’m highly motivated, and I’m confident I can add value quickly.|I’d simply emphasise my commitment to learning and teamwork.`],'Interviewer'],

/* ===== v6: Structured English Course (A1 first; local content, no paid services) ===== */
const A1RAW=`T Greetings and introductions
O Greet people at different times of day|Introduce yourself and ask someone’s name
E We use different greetings at different times of day. “Hello” and “Hi” work at any time. To introduce yourself, say “My name is…” or “I’m…”, then say “Nice to meet you.”
X Good morning! How are you?|Hello, my name is Sara.|Nice to meet you, Sara.|I’m from Brazil. Where are you from?|Goodbye! See you tomorrow.
V hello=a word to greet someone=Hello, Tom!|goodbye=a word to say when you leave=Goodbye, see you soon.|name=what people call you=My name is Ali.|meet=to see and talk to someone for the first time=I want to meet your sister.
G “I’m” is short for “I am”. Say “My name is Sara” or “I’m Sara”.
Q Which greeting is best in the morning?|Good night|Good morning|Good afternoon|1|We say “Good morning” before about noon. “Good night” is for saying goodbye at bedtime.
Q Complete: “___ name is Ali.”|My|I|Me|0|“My” shows that the name belongs to the speaker.
Q What do you say after “Nice to meet you”?|Goodbye|Nice to meet you too|Good morning|1|We answer with “Nice to meet you too.”
Q Which sentence asks someone’s name?|What’s your name?|Where is your name?|How old is name?|0|“What’s your name?” is the normal question.
Q “I’m” means…|I am|I have|I will|0|The apostrophe replaces the letter “a” in “am”.

T Alphabet and spelling
O Say the letters of the English alphabet|Spell your name aloud
E The English alphabet has 26 letters: 5 vowels (A, E, I, O, U) and 21 consonants. When we spell a word, we say each letter slowly. Use “How do you spell that?” to ask for help.
X How do you spell your name?|My name is Omar, O-M-A-R.|Can you spell that, please?|The word “book” has four letters.|A, E, I, O and U are vowels.
V letter=a written symbol such as A or B=There are 26 letters in English.|spell=to say the letters of a word in order=Please spell your surname.|vowel=one of the letters A, E, I, O, U=The word “egg” starts with a vowel.|surname=your family name=My surname is Khan.
Q How many letters are in the English alphabet?|24|26|28|1|There are 26 letters, from A to Z.
Q Which letter is a vowel?|B|E|T|1|The vowels are A, E, I, O and U.
Q Which question asks for spelling?|How do you spell that?|How old are you?|What time is it?|0|“How do you spell that?” asks for the letters of a word.
Q How many letters are in the word “book”?|three|four|five|1|B-O-O-K has four letters.
Q “Surname” means…|first name|family name|nickname|1|A surname is a family name, like “Khan” or “Smith”.

T Numbers, dates and time
O Use numbers from 1 to 100|Tell the time and say the date
E Numbers from 13 to 19 end in “-teen”, and tens end in “-ty” (twenty, thirty). For time we say “It’s three o’clock” or “half past three”. For dates we use ordinal numbers: first, second, third.
X I have two brothers and three sisters.|It’s seven o’clock.|The class starts at half past nine.|My birthday is on the fifth of May.|This book costs twenty dollars.
V o’clock=a word for an exact hour=It’s ten o’clock.|half=one of two equal parts=Half past two is 2:30.|date=the day, month and year=What’s the date today?|hundred=the number 100=A hundred people came.
G Use “at” with clock times (at six o’clock) and “on” with dates (on May 5th).
Q Which number is 15?|fifty|fifteen|five|1|Fifteen ends in “-teen”, but fifty ends in “-ty”.
Q What time is 2:30?|half past two|two o’clock|half past three|0|“Half past two” means thirty minutes after two.
Q The meeting is ___ 9 o’clock.|on|at|in|1|We use “at” with clock times.
Q Which is correct for the 3rd of June?|the three of June|the third of June|the threeth of June|1|Dates use ordinal numbers, and 3 becomes “third”.
Q How do you ask the time?|What time is it?|What date is it time?|How many time?|0|“What time is it?” is the standard question.

T The verb “to be”
O Use am, is and are correctly|Make positive, negative and question forms
E The verb “to be” links a subject to a description. Use “am” with I, “is” with he, she and it, and “are” with you, we and they. Add “not” to make a negative. For questions, put the verb first: “Are you ready?”
X I am a student.|She is from Egypt.|We are friends.|He isn’t at home.|Are you hungry?
V student=a person who studies=I am a student at a language school.|tired=needing rest=He is tired after work.|ready=prepared=We are ready to start.|hungry=wanting food=The children are hungry.
G Short forms: I’m, you’re, he’s, she’s, it’s, we’re, they’re, isn’t, aren’t.
Q She ___ a teacher.|am|is|are|1|“She” uses “is”.
Q They ___ at the station.|is|am|are|2|“They” uses “are”.
Q Which is a correct question with “be”?|You are happy?|Are you happy?|Do you happy?|1|For “be” questions, put the verb before the subject.
Q Make this negative: “It is cold.”|It not is cold.|It is not cold.|It does not cold.|1|Put “not” after “is”.
Q I ___ twenty years old.|am|is|are|0|“I” always uses “am”.

T Pronouns and basic sentence structure
O Use the pronouns I, you, he, she, it, we and they|Build simple sentences with a subject, verb and object
E Pronouns replace nouns so we do not repeat them. A basic English sentence follows the order subject, verb, object: “Maria likes tea.” Keep this order in statements.
X Maria is my friend. She is kind.|The books are new. They are on the table.|I like coffee.|We watch films at the weekend.|He reads a book every night.
V pronoun=a word used instead of a noun=“She” is a pronoun.|subject=who or what does the action=In “Tom runs”, Tom is the subject.|object=who or what receives the action=In “I like tea”, tea is the object.|sentence=a group of words with a complete idea=This is a short sentence.
G Subject + verb + object: I (subject) + like (verb) + music (object).
Q Which pronoun replaces “my brother”?|she|he|they|1|“Brother” is male and singular, so use “he”.
Q Which pronoun replaces “the cars”?|it|they|we|1|“The cars” is plural, so use “they”.
Q Put the words in order: tea / likes / Anna|Likes Anna tea.|Anna likes tea.|Tea Anna likes.|1|The order is subject, verb, object.
Q In “I read books”, the object is…|I|read|books|2|“Books” receives the action of reading.
Q Which pronoun means you and other people together with you?|they|we|you|1|“We” means the speaker plus other people.

T Family and personal information
O Talk about your family|Give personal information such as age, job and country
E We use “have” for family members and “I’m… years old” for age. To say where you are from, use “I’m from…”. For a job, say “I’m a nurse” or “I work as an engineer.”
X I have one brother and two sisters.|My mother is a doctor.|I’m thirty years old.|My cousin lives in Canada.|She is my father’s sister, so she is my aunt.
V parents=your mother and father=My parents live in a small town.|brother=a boy or man with the same parents as you=My brother is older than me.|aunt=your parent’s sister=My aunt is a teacher.|age=how many years old someone is=What is your age?
G Say “I am 25 years old”, not “I have 25 years”.
Q How do you say your age?|I have 25 years.|I am 25 years old.|I am 25 year.|1|English uses “be” for age, plus “years old”.
Q Your mother’s sister is your…|aunt|cousin|niece|0|Your parent’s sister is your aunt.
Q Choose the correct sentence.|I have two brother.|I have two brothers.|I has two brothers.|1|After “two” we use a plural noun, and “I” uses “have”.
Q What does “parents” mean?|mother and father|brother and sister|grandmother|0|Parents are your mother and father.
Q Which sentence gives your country?|I’m from Kenya.|I’m on Kenya.|I’m at Kenya.|0|We use “from” for the country where someone belongs.

T Common everyday vocabulary
O Learn useful nouns and verbs for daily life|Use them in short sentences
E Everyday words help you talk about home, work and free time. Learn nouns (things) and verbs (actions) together in short phrases, for example “open the door” or “drink water”. Say each new word aloud to remember it.
X Please open the window.|I drink water every morning.|My phone is on the table.|We need a new chair.|Can you close the door?
V door=the part you open to enter a room=Please close the door.|water=a clear drink=I drink water every day.|table=a piece of furniture with a flat top=The keys are on the table.|phone=a device for calls and messages=My phone is in my bag.
Q Which word is a verb?|open|table|water|0|“Open” is an action word.
Q Where do you usually eat a meal at home?|at the table|at the phone|in the water|0|We eat at a table.
Q Complete: “Please ___ the window; it is hot.”|open|drink|sit|0|Opening the window lets in air.
Q Which is something you drink?|chair|water|door|1|Water is a drink.
Q “I use my ___ to call my mother.”|phone|chair|door|0|A phone is used to call people.

T Asking simple questions
O Use the question words what, where, who, when and how|Ask yes/no questions with do, does and be
E Question words start information questions: “Where do you live?” For yes/no questions, put the helping verb first: “Do you like tea?” or “Is she at home?” Use “does” with he, she and it.
X What is your name?|Where do you live?|Who is that man?|When does the shop open?|Do you speak English?
V what=a word that asks about a thing=What is this?|where=a word that asks about a place=Where is the bank?|when=a word that asks about time=When is the lesson?|how=a word that asks about a way or state=How are you?
G Do/does + subject + verb: Do you work here? Does she work here?
Q ___ is the bank? It’s near the park.|Who|Where|When|1|“Where” asks about a place.
Q ___ does the lesson start? At nine.|What|When|Who|1|“When” asks about time.
Q Which question uses “does” correctly?|Does she like pizza?|Do she like pizza?|Does she likes pizza?|0|Use “does” with “she”, and the main verb stays simple.
Q Which question asks about a person?|Who is she?|Where is she?|When is she?|0|“Who” asks about people.
Q ___ are you? I’m fine, thanks.|How|Which|Where|0|“How are you?” asks about someone’s state.`;

function prs(raw){return raw.trim().split('\n\n').map(b=>{const o={t:'',o:[],e:'',x:[],v:[],g:'',q:[]};b.split('\n').forEach(l=>{const k=l[0],r=l.slice(2);if(k==='T')o.t=r;else if(k==='O')o.o=r.split('|');else if(k==='E')o.e=r;else if(k==='X')o.x=r.split('|');else if(k==='V')o.v=r.split('|').map(x=>x.split('='));else if(k==='G')o.g=r;else if(k==='Q'){const p=r.split('|');o.q.push({q:p[0],o:[p[1],p[2],p[3]],a:+p[4],w:p[5]})}});return o})}
const A2L=prs(`T Present simple versus present continuous
O Choose the present simple for habits and facts|Choose the present continuous for actions happening now
E We use the present simple for habits, routines and facts: “I walk to work every day.” We use the present continuous for actions happening now or around now: “I am walking to work right now.” Time words help: “every day” and “usually” go with the simple, while “now” and “at the moment” go with the continuous.
X I drink tea every morning.|Right now, I am drinking coffee.|She works in a hospital.|She is working late tonight.|They are playing football at the moment.
V routine=something you do regularly=My morning routine starts at six.|at the moment=now=I am busy at the moment.|usually=most of the time=We usually eat at home.|currently=at this time=He is currently studying law.
G Present continuous = am/is/are + verb-ing. Verbs such as know, like and want are not normally used in the continuous.
Q She ___ to school by bus every day.|goes|is going|go|0|“Every day” shows a routine, so we use the present simple. With “she”, we add -es: goes.
Q Look! It ___ outside.|rains|is raining|rain|1|“Look!” points to something happening now, so we use the present continuous.
Q Which sentence is correct?|I am knowing the answer.|I know the answer.|I knowing the answer.|1|“Know” is a state verb, so we normally use the present simple.
Q We ___ dinner at the moment.|have|are having|has|1|“At the moment” needs the present continuous: are having.
Q Water ___ at 100 degrees Celsius.|boils|is boiling|boil|0|Facts use the present simple.

T Past simple tense
O Talk about finished actions in the past|Make past simple questions and negatives
E We use the past simple for actions that finished in the past: “I visited my aunt yesterday.” For a negative, use “did not (didn’t)” + the base verb: “I didn’t visit her.” For a question, use “Did” + subject + base verb: “Did you visit her?” After “did”, the main verb never takes -ed.
X I visited my cousin last weekend.|We didn’t go out because it rained.|Did you see the match yesterday?|She started a new job in March.|They watched a film and then went home.
V yesterday=the day before today=I called him yesterday.|last week=the week before this one=We moved house last week.|ago=before now=She left two hours ago.|finish=to complete something=I finished work at six.
G Negative: didn’t + base verb. Question: Did + subject + base verb?
Q They ___ in London for three years.|live|lived|living|1|Regular verbs add -ed or -d in the past simple: lived.
Q Choose the correct negative.|She didn’t came to the party.|She didn’t come to the party.|She not came to the party.|1|After “didn’t” the main verb stays in its base form.
Q ___ you call me last night?|Do|Did|Are|1|Past simple questions start with “Did”.
Q “Ago” is used with time in the…|past|future|present|0|“Two days ago” means two days before now.
Q Which sentence describes a finished time?|I work here since 2020.|I worked there in 2020.|I am working there in 2020.|1|“In 2020” is a finished time, so we use the past simple.

T Regular and irregular past-tense verbs
O Spell regular past forms correctly|Use common irregular past verbs
E Regular verbs add -ed (walk, walked). If a verb ends in -e, add -d (live, lived). If it ends in consonant + y, change y to i (study, studied). Irregular verbs have special forms that you must learn: go, went; buy, bought; see, saw.
X I walked to the market this morning.|She studied until midnight.|We went to the beach on Sunday.|He bought a new phone last month.|They saw their friends at the station.
V buy=to get something by paying money=I buy bread every day.|bought=the past form of buy=She bought a ticket.|went=the past form of go=We went home early.|saw=the past form of see=I saw a bird in the garden.
G Common irregular verbs: go-went, have-had, eat-ate, take-took, come-came, make-made.
Q What is the past simple of “study”?|studyed|studied|studed|1|After a consonant, change y to i and add -ed.
Q What is the past simple of “go”?|goed|went|gone|1|“Go” is irregular: went.
Q Yesterday I ___ a delicious sandwich.|eated|ate|eaten|1|“Eat” is irregular: ate.
Q She ___ a cake for my birthday.|maked|made|make|1|“Make” is irregular: made.
Q Which verb is regular?|play|come|buy|0|“Play” becomes “played”. “Come” and “buy” are irregular.

T Future plans with “going to”
O Talk about plans and intentions|Make positive, negative and question forms with “going to”
E We use “going to” + base verb for plans we decided before speaking: “I am going to visit my grandmother.” We also use it when we can see that something will happen: “Look at those clouds. It’s going to rain.” The negative is “I’m not going to…”. The question is “Are you going to…?”
X I’m going to study English tonight.|We’re going to travel in July.|She isn’t going to work tomorrow.|Are you going to join us?|Look at the sky! It’s going to rain.
V plan=something you decide to do=My plan is to learn ten new words a day.|tomorrow=the day after today=Tomorrow is Friday.|next week=the week after this one=We’re moving next week.|intend=to plan to do something=I intend to save money.
G going to = am/is/are + going to + base verb.
Q I ___ visit my parents this weekend.|am going to|go to|am go to|0|Use am/is/are + going to + base verb.
Q She ___ going to cook tonight because she is tired.|isn’t|doesn’t|aren’t|0|With “she”, the negative is “isn’t going to”.
Q ___ you going to buy a car?|Do|Are|Is|1|Questions with “you” use “Are you going to…?”
Q Look at those clouds. It ___.|is going to rain|rains|rained|0|We use “going to” for a prediction based on evidence.
Q Which sentence shows a plan?|I’m going to learn the guitar.|I learned the guitar.|I learn the guitar yesterday.|0|“Going to” talks about a plan for the future.

T Will and won’t for basic predictions
O Make predictions with “will” and “won’t”|Choose between “will” and “going to”
E We use “will” + base verb for predictions and opinions about the future: “I think it will be sunny.” We also use “will” for quick decisions: “I’ll help you.” The negative is “will not (won’t)”. The question is “Will it rain?” After “will”, the verb never takes -s.
X I think it will be cold tomorrow.|She will probably win the game.|It won’t take long.|Will you help me with this bag?|I’ll call you after the meeting.
V probably=very likely=It will probably rain tonight.|perhaps=maybe=Perhaps he will come later.|prediction=a statement about what will happen=My prediction is that the team will win.|promise=to say you will definitely do something=I promise I’ll be on time.
G will/won’t + base verb for every subject: he will go, they won’t go.
Q I think she ___ the exam.|will pass|will passes|pass will|0|After “will”, use the base verb.
Q The phone is ringing. “I ___ answer it.”|will|am going|am|0|Quick decisions use “will”: I’ll answer it.
Q Make this negative: “It will rain.”|It won’t rain.|It doesn’t will rain.|It not will rain.|0|The negative of “will” is “will not” or “won’t”.
Q Which word often goes with “will” for a likely event?|probably|yesterday|ago|0|“Probably” shows that something is likely.
Q Choose the correct question.|Will you to come?|Will you come?|Do you will come?|1|Questions begin with “Will” + subject + base verb.

T Countable and uncountable nouns
O Tell countable and uncountable nouns apart|Use a/an and plural forms correctly
E Countable nouns can be counted: one apple, two apples. Uncountable nouns cannot be counted one by one: water, rice, information, advice. We do not add -s to uncountable nouns, and we do not use “a” before them. We can use a container word instead: a glass of water, a bag of rice.
X I need an apple and two bananas.|We don’t have any rice.|Can I have a glass of water?|She gave me some good advice.|There is a lot of traffic today.
V advice=a helpful suggestion=Thank you for your advice.|information=facts about something=I need some information.|bottle=a container for liquids=Please buy a bottle of milk.|traffic=cars moving on a road=The traffic is heavy this morning.
G Uncountable nouns take singular verbs: The water is cold. Do not say “advices” or “informations”.
Q Which noun is uncountable?|rice|banana|bottle|0|You do not say “one rice, two rices”.
Q Which sentence uses the noun correctly?|She gave me an advice.|She gave me some advice.|She gave me advices.|1|“Advice” is uncountable, so we say “some advice”.
Q I need ___ information.|an|some|two|1|Use “some” with uncountable nouns.
Q How can you count milk?|two milks|two bottles of milk|a milk|1|Use a container word such as “bottle of”.
Q The traffic ___ very heavy.|is|are|were|0|Uncountable nouns take a singular verb.

T Some, any, much and many
O Use some and any in statements, questions and negatives|Use much and many with the right nouns
E Use “some” in positive sentences: “I have some friends.” Use “any” in questions and negatives: “Do you have any money?” “I don’t have any time.” Use “many” with countable nouns and “much” with uncountable nouns, usually in questions and negatives: “How many books?” “How much water?”
X I bought some vegetables.|Do you have any brothers or sisters?|We don’t have any milk.|How many people are coming?|There isn’t much time left.
V enough=as much as you need=We have enough chairs.|a lot of=a large number or amount=She has a lot of friends.|a few=a small number=I have a few questions.|a little=a small amount=Add a little sugar.
G In offers and requests we can use “some”: Would you like some tea?
Q I don’t have ___ money.|some|any|many|1|Negatives usually use “any”.
Q How ___ students are in your class?|much|many|any|1|“Students” is countable, so use “many”.
Q How ___ sugar do you take?|many|much|few|1|“Sugar” is uncountable, so use “much”.
Q Would you like ___ coffee?|any|some|many|1|In offers we normally use “some”.
Q There ___ many cars on the road at night.|aren’t|isn’t|doesn’t|0|“Cars” is plural, so use “aren’t”.

T Comparatives and superlatives
O Compare two things with comparatives|Use superlatives for the highest or lowest in a group
E For short adjectives add -er and -est: fast, faster, the fastest. For long adjectives use more and the most: expensive, more expensive, the most expensive. Some adjectives are irregular: good, better, the best; bad, worse, the worst. We use “than” after a comparative.
X My brother is taller than me.|This phone is cheaper than that one.|The train is more comfortable than the bus.|It was the best holiday of my life.|Cairo is one of the biggest cities in Africa.
V cheap=not expensive=This café is cheap.|comfortable=pleasant to sit or stay in=The sofa is comfortable.|tall=high, usually for people or buildings=She is taller than me.|expensive=costing a lot of money=Hotels here are expensive.
G Double the final consonant in short adjectives like big: bigger, the biggest. Change y to i: easy, easier, the easiest.
Q Today is ___ than yesterday.|hotter|more hot|the hottest|0|“Hot” is short, so double the t: hotter.
Q This is ___ book I have ever read.|better|the best|more good|1|“Good” has the irregular superlative “the best”.
Q Which is correct?|more expensive than|expensiver than|most expensive than|0|Long adjectives use “more” + adjective + “than”.
Q What is the comparative of “easy”?|easyer|easier|more easy|1|Change y to i and add -er.
Q What is the superlative of “bad”?|worse|the worst|the baddest|1|“Bad” is irregular: worse, the worst.`);

A1L.push(...prs(`T Countries and nationalities
O Name some countries and nationalities|Say where you and other people are from
E A country is a place, like Brazil. A nationality tells us where a person is from, like Brazilian. We say “I’m from Brazil” or “I’m Brazilian.” Countries and nationalities always start with a capital letter.
X I’m from Pakistan. I’m Pakistani.|She is from Japan. She is Japanese.|We are from Spain, so we are Spanish.|Are you from Mexico?|My teacher is from Canada. He is Canadian.
V country=an area with its own government=Egypt is a country in Africa.|nationality=the country a person belongs to=My nationality is Indian.|language=the words people use to speak=They speak Spanish.|capital=the most important city of a country=Paris is the capital of France.
G Say “I’m from India” (country) or “I’m Indian” (nationality). Do not say “I’m from Indian”.
Q Which word is a nationality?|Germany|German|Berlin|1|“German” describes a person from Germany.
Q Complete: “She is from Italy. She is ___.”|Italy|Italian|Italians|1|After “is”, we use the nationality word “Italian”.
Q Which sentence is right for saying your country?|I’m from Chinese.|I’m from China.|I’m China.|1|After “from” we use the country name.
Q Which is written correctly?|turkey|Turkey|turKey|1|Country names start with a capital letter.
Q What is the capital of France?|Paris|Rome|Madrid|0|Paris is the capital city of France.

T Articles: a, an and the
O Use a, an and the correctly|Choose a or an by sound
E We use “a” or “an” for one thing when we first mention it: “I have a dog.” We use “an” before a vowel sound: “an apple”. We use “the” for something specific that both people know: “The dog is in the garden.”
X I have a brother and a sister.|She eats an apple every day.|It’s an old car.|The sun is very hot today.|I saw a film last night. The film was great.
V an apple=one apple=I eat an apple at lunch.|an hour=sixty minutes, with a silent h=The lesson is an hour long.|a university=a place of higher study, starting with a “you” sound=She studies at a university.|the moon=the one moon we see at night=The moon is bright tonight.
G Look at the sound, not the letter: “an hour” but “a university”.
Q I have ___ orange in my bag.|a|an|two|1|“Orange” starts with a vowel sound, so use “an”.
Q My father is ___ engineer.|a|an|two|1|“Engineer” starts with a vowel sound.
Q Choose the correct phrase.|a hour|an hour|a our|1|“Hour” starts with a vowel sound because the h is silent.
Q I bought a book. ___ book is very interesting.|A|The|An|1|We use “the” when we mention the same thing again.
Q Pick the correct phrase for a place of study.|an university|a university|the a university|1|“University” starts with a “you” sound, so we use “a”.

T Singular and plural nouns
O Make regular plural nouns|Use common irregular plurals
E Most nouns add -s for the plural: one book, two books. Nouns ending in -s, -sh, -ch or -x add -es: bus, buses. If a noun ends in consonant + y, change y to i and add -es: city, cities. Some plurals are irregular: man, men; child, children; person, people.
X I have two sisters.|There are three buses at the station.|Big cities are busy.|The children are in the garden.|Two women and one man are waiting.
V child=a young person=The child is five years old.|children=more than one child=The children play outside.|woman=an adult female=That woman is my teacher.|women=more than one woman=The women work here.
G Irregular plurals: man-men, woman-women, child-children, foot-feet, person-people.
Q What is the plural of “box”?|boxs|boxes|boxies|1|Nouns ending in -x add -es.
Q What is the plural of “city”?|citys|cities|cityes|1|After a consonant, change y to i and add -es.
Q What is the plural of “child”?|childs|children|childes|1|“Child” has an irregular plural: children.
Q Which sentence has the right plural?|Three man are here.|Three men are here.|Three mens are here.|1|The plural of “man” is “men”.
Q What is the plural of “book”?|books|bookes|bookies|0|Most nouns simply add -s.

T This, that, these and those
O Point to things near you and far from you|Choose singular or plural words
E “This” and “these” are for things near you. “That” and “those” are for things far from you. Use “this” and “that” with one thing, and “these” and “those” with more than one: “This book is mine. Those books are yours.”
X This is my phone.|That building is a bank.|These shoes are comfortable.|Those children are my neighbours.|What is that over there?
V near=not far away=The bus stop is near my house.|far=a long way away=The airport is far from here.|over there=in that place, not here=My car is over there.|neighbour=a person who lives next to you=My neighbour is friendly.
G this/that + singular noun; these/those + plural noun.
Q ___ pen in my hand is blue.|These|This|Those|1|One pen near me needs “this”.
Q Which word points to two cars far away?|those|this|these|0|“Those” is plural and far away.
Q ___ are my keys, here on the table.|These|That|Those|0|The keys are plural and near.
Q Choose the right word: “___ house over there is big.”|That|Those|These|0|One house far away needs “that”.
Q “These” is the plural of…|that|this|those|1|“These” is the plural of “this”.

T Possessive adjectives
O Use my, your, his, her, its, our and their|Show who something belongs to
E Possessive adjectives show who something belongs to. They come before a noun: “my bag”, “her phone”. Use “his” for a man, “her” for a woman, “its” for a thing or animal, and “their” for more than one person.
X My name is Hana.|Is this your bag?|His brother lives in Dubai.|Her house has a small garden.|We love our teacher, and they love their school.
V belong=to be owned by someone=This book belongs to me.|owner=the person who has something=The owner of the shop is kind.|bag=something you carry things in=Her bag is red.|garden=a place outside a house with plants=Our garden is small.
G “Its” has no apostrophe: The cat likes its food.
Q Sara has a car. ___ car is red.|His|Her|Their|1|Sara is a woman, so we use “her”.
Q We live in a small house. ___ house is old.|Our|Your|Her|0|“We” becomes “our”.
Q Tom and Jim play football. ___ team is good.|Their|His|Our|0|Two people together use “their”.
Q The dog wants ___ dinner.|it’s|its|their|1|The possessive “its” has no apostrophe.
Q Which word comes before a noun to show ownership?|my|me|I|0|“My” is a possessive adjective.

T Jobs and occupations
O Name common jobs|Ask and answer questions about work
E We ask “What do you do?” to find out someone’s job. We answer “I’m a teacher” or “I work as a nurse.” Use “a” or “an” before the job: a driver, an engineer. We say where we work with “in” or “at”: “I work in a hospital.”
X What do you do? I’m a teacher.|My sister is a nurse.|He works in a bank.|She is an engineer at a big company.|They are drivers, and they work in the city.
V doctor=a person who treats sick people=The doctor works in a clinic.|driver=a person who drives vehicles=He is a bus driver.|farmer=a person who grows food=The farmer has many animals.|engineer=a person who designs machines or buildings=She is an engineer.
G Use “an” before a vowel sound: an engineer, an electrician.
Q Which question asks about someone’s job?|What do you do?|How old are you?|Where is your bag?|0|“What do you do?” asks about a person’s job.
Q A person who treats sick people is a…|doctor|farmer|driver|0|A doctor treats people who are ill.
Q A person who grows food is a…|farmer|driver|nurse|0|A farmer grows crops and keeps animals.
Q I work ___ a hospital.|in|under|between|0|We say “work in” a hospital.
Q Which phrase is correct?|an engineer|a engineer|an teacher|0|Use “an” before a vowel sound.

T There is and there are
O Say what exists in a place|Use there is, there are and their negatives
E We use “there is” with one thing and “there are” with more than one: “There is a park near my house. There are two shops.” The negative is “there isn’t” or “there aren’t”. Questions: “Is there a bank here?” “Are there any shops?”
X There is a library in my town.|There are three bedrooms in the flat.|There isn’t a supermarket near here.|Are there any restaurants nearby?|Is there a bus stop on this street?
V library=a place where you borrow books=The library is open today.|bedroom=a room for sleeping=Our flat has two bedrooms.|nearby=close to this place=Is there a pharmacy nearby?|street=a road in a town=There are trees on our street.
G Use “there is/there are” to introduce something new. Use “it is” for something you already know.
Q ___ a cat on the sofa.|There is|There are|Are there|0|One cat needs “there is”.
Q ___ four chairs in the kitchen.|There is|There are|Is there|1|Plural nouns need “there are”.
Q Make this negative: “There is a bank here.”|There isn’t a bank here.|There not is a bank here.|There doesn’t a bank here.|0|The negative of “there is” is “there isn’t”.
Q Which question is correct?|Are there any shops?|Is there any shops?|There are any shops?|0|“Shops” is plural, so use “Are there”.
Q How do you ask about one bus stop?|Is there a bus stop?|Are there a bus stop?|There is bus stop?|0|“Is there a…?” asks about one thing.

T Prepositions of place
O Describe where things are|Use in, on, under, next to, behind and between
E Prepositions of place tell us where something is. “In” means inside, “on” means on a surface, and “under” means below. “Next to” means beside, “behind” is at the back, and “between” is in the middle of two things.
X The keys are on the table.|The cat is under the chair.|My bag is in the car.|The bank is next to the post office.|The park is between the school and the market.
V behind=at the back of something=The garden is behind the house.|next to=beside=I sit next to my friend.|between=in the middle of two things=The shop is between the bank and the café.|opposite=on the other side, facing=The school is opposite the park.
G Say “at the bus stop” for a point, “in the room” for inside, and “on the wall” for a surface.
Q The book is ___ the table.|on|in|between|0|The book is on the top surface.
Q The cat is hiding ___ the bed.|under|on|at|0|“Under” means below.
Q The post office is ___ the bank and the café.|between|on|in|0|“Between” means in the middle of two things.
Q I wait for the bus ___ the bus stop.|at|between|under|0|We use “at” for a specific point.
Q The pharmacy is ___ the school, on the other side of the street.|opposite|under|inside|0|“Opposite” means across from.

T Have and has
O Use have and has to talk about what people own|Make negatives and questions with have
E Use “have” with I, you, we and they, and “has” with he, she and it: “I have a bike. She has a bike.” For negatives, use “don’t have” or “doesn’t have”. For questions, use “Do you have…?” or “Does he have…?”
X I have two brothers.|She has a new phone.|We don’t have a car.|He doesn’t have any money today.|Do you have a pen?
V bike=a vehicle with two wheels=I have a red bike.|pet=an animal you keep at home=We have a pet cat.|ticket=a paper or card that lets you travel or enter=Do you have a ticket?|sister=a girl or woman with the same parents=She has one sister.
G After doesn’t, use have, not has: She doesn’t have a car.
Q My sister ___ a new job.|have|has|haves|1|“My sister” is “she”, so use “has”.
Q They ___ two children.|has|have|having|1|“They” uses “have”.
Q Which negative sentence is right?|He doesn’t has a bike.|He doesn’t have a bike.|He don’t have a bike.|1|After “doesn’t”, use “have”.
Q Which question about a ticket is correct?|Does she have a ticket?|Does she has a ticket?|Do she have a ticket?|0|After “does”, use “have”.
Q Pick the correct sentence about a pet.|We has a pet.|We have a pet.|We haves a pet.|1|“We” uses “have”.

T Present simple tense
O Use the present simple for habits and facts|Add -s or -es for he, she and it
E We use the present simple for habits, routines and facts: “I work in a shop.” With he, she and it, add -s: “She works in a shop.” Verbs ending in -sh, -ch, -s, -x or -o add -es: watches, goes. Verbs ending in consonant + y change y to i: studies.
X I live in a small town.|My brother works at a bank.|The shop opens at nine.|She studies English every evening.|We play football on Saturdays.
V habit=something you do again and again=Drinking tea is my habit.|always=every time=I always brush my teeth.|never=not at any time=He never eats meat.|often=many times=We often visit our grandparents.
G Add -s: works. Add -es: watches, goes. Change y to i: study, studies.
Q He ___ in a bank.|work|works|working|1|With “he”, add -s to the verb.
Q She ___ TV in the evening.|watchs|watches|watchies|1|Verbs ending in -ch add -es.
Q They ___ English on Mondays.|study|studies|studys|0|“They” uses the base verb.
Q My brother ___ to school by bus.|go|goes|going|1|“Go” becomes “goes” with he, she and it.
Q Which sentence is a habit?|I am eating now.|I eat breakfast at seven.|I ate breakfast.|1|Habits use the present simple.

T Daily routines
O Talk about your day from morning to night|Say what time you do things
E Daily routines are the things we do every day. We say times with “at”: “I get up at six.” We use time words like first, then, after that and finally to put actions in order. Use the present simple: “I have breakfast, then I go to work.”
X I get up at six o’clock.|She has breakfast and goes to work.|We have lunch at one.|After that, I study for an hour.|Finally, I go to bed at ten.
V get up=to leave your bed in the morning=I get up at seven.|breakfast=the first meal of the day=I have breakfast at home.|go to bed=to get into bed to sleep=Children go to bed early.|finish=to complete=I finish work at five.
G Use “have” with meals: have breakfast, have lunch, have dinner.
Q I ___ up at six every morning.|get|gets|getting|0|“I” uses the base verb.
Q We have lunch ___ one o’clock.|at|on|in|0|We use “at” with clock times.
Q Which word shows the last step?|finally|first|then|0|“Finally” introduces the last action.
Q Which is the correct order for the start of the day?|get up, have breakfast, go to work|go to work, get up, have breakfast|have breakfast, go to work, get up|0|Most people get up first, eat, then leave for work.
Q Which phrase means “to leave your bed in the morning”?|get up|go to bed|finish work|0|“Get up” means to leave your bed.

T Negatives and basic questions
O Make negative sentences with don’t and doesn’t|Ask yes/no questions with do and does
E In the present simple, we make negatives with “do not (don’t)” or “does not (doesn’t)” before the base verb: “I don’t like fish. He doesn’t like fish.” For yes/no questions we start with “Do” or “Does”: “Do you like fish?” We answer “Yes, I do.” or “No, I don’t.”
X I don’t speak French.|She doesn’t work on Sundays.|We don’t have a car.|Do you live near here?|Does he play football? No, he doesn’t.
V speak=to talk using your voice=I speak two languages.|work=to have a job, or to do a job=She works on weekdays.|near=not far=Do you live near the station?|weekend=Saturday and Sunday=I rest at the weekend.
G After don’t/doesn’t and after do/does, use the base verb: She doesn’t work. Does she work?
Q She ___ like coffee.|don’t|doesn’t|isn’t|1|“She” takes “doesn’t”.
Q Choose the correct short answer: “Do you live here?”|Yes, I do.|Yes, I live.|Yes, I am.|0|We answer “Do you…?” with “do”.
Q They ___ work on Sundays.|doesn’t|don’t|aren’t|1|“They” takes “don’t”.
Q Which yes/no question is right?|Does he plays tennis?|Does he play tennis?|Do he play tennis?|1|After “does”, the verb stays in the base form.
Q Make this negative: “We eat meat.”|We don’t eat meat.|We doesn’t eat meat.|We not eat meat.|0|Use “don’t” with “we” + the base verb.`));

function cvStart(i){cv.s=i;cv.t=-1;cv.a=[];cv.m=[];cv.hn=[];go();scrollTo(0,0)}
function cvHint(){const t=cvT(cv.s,cv.lv)[cv.t],e=t[1],K=nz(e).filter(w=>!SW.has(w)),h=cv.hn=cv.hn||[],o=e.split(' ');h[cv.t]=(h[cv.t]||0)+1;$('#cvh').innerHTML=h[cv.t]===1?`<div class='card'><small>Hint 1: useful words</small><p><b>${K.slice(0,4).join(', ')}</b></p></div>`:`<div class='card'><small>Hint 2: how you could start</small><p><b>${o.slice(0,Math.min(3,o.length-1)).join(' ')}…</b></p><small>Tap an example answer to see a full reply.</small></div>`}
function cvIntro(){const P=CP[cv.s],T=cvT(cv.s,cv.lv);return `<button class='back' onclick='cvExit()'>← Scenarios</button><h2>${P[1]} ${P[0]}</h2><small>${CPL[cv.lv]}, ${T.length} turns. You reply to the ${P[3].toLowerCase()}.</small><div class='card'><b>Useful phrases</b>${T.map(t=>`<div class='row'><span>${t[1]}</span>${sb(t[1])}</div>`).join('')}</div><p class='note'>This is guided practice with scripted conversations. The app checks your words on your phone. It is not a live AI conversation.</p><button class='b' onclick='cv.t=0;go();scrollTo(0,0)'>Start conversation</button>`}
function cvList2(){const done=CPO.filter(i=>((S.cvd&&S.cvd[i+'-'+cv.lv])||0)>=cvT(i,cv.lv).length).length;return `<h2>Conversation Practice</h2><div class='card'><b>Guided practice</b><p><small>You follow scripted conversations and the app checks your words against expected answers on your phone. It is not a live AI conversation, and it cannot understand every possible answer.</small></p></div><b>Difficulty</b><div class='chips'>${CPL.map((x,i)=>`<button class='chip ${cv.lv===i?'on':''}' data-i='${i}' onclick='cv.lv=+this.dataset.i;go()'>${x}</button>`).join('')}</div><small>${done} of ${CP.length} completed at this level</small>`+CPO.map(i=>{const p=CP[i],n=cvT(i,cv.lv).length,d=(S.cvd&&S.cvd[i+'-'+cv.lv])||0;return `<div class='card tap' data-i='${i}' onclick='cvStart(+this.dataset.i)'><b>${d>=n?'✅ ':''}${p[1]} ${p[0]}</b><p><small>${CPL[cv.lv]}, ${n} turns. The ${p[3].toLowerCase()} speaks first, then you reply.</small></p></div>`}).join('')}
{const c0=V.conv;V.conv=()=>cv.s==null?cvList2():cv.t<0?cvIntro():c0().replace("<button class='b sm' onclick='cvCheck()'>Check</button>","<button class='b sm alt' onclick='cvHint()'>💡 Hint</button><button class='b sm' onclick='cvCheck()'>Check</button>").replace("<div id='cvf'></div>","<div id='cvh'></div><div id='cvf'></div>")}

/* ===== ROUTER ===== */
const T=[['home','🏠','Home'],['lessons','📘','Lessons'],['speak','🎙️','Speaking'],['vocab','🔤','Vocabulary'],['gram','✏️','Grammar'],['quiz','🧠','Quizzes'],['prog','📈','Progress'],['plan','📅','Free plan'],['prem','⭐','Premium'],['more','ℹ️','More']];
$('#nav').innerHTML=T.filter(t=>NAVM.includes(t[0])).map(t=>`<button data-n="${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
function go(n){if(n&&n!==cur){cur=n;scrollTo(0,0)}$('#v').innerHTML=V[cur]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===cur));$('#lvb').textContent=LV[S.lv]}
go('home');
</script></body></html>
